HELP_1: |-
  <b><u>संगीत प्ले कमांड 🎵</u></b> के बा
  ────────────────────────────────

  <b>/play [नाम/लिंक] -</b> वॉयस चैट पर ऑडियो स्ट्रीमिंग शुरू करीं।
  <b>/vplay [नाम/लिंक] -</b> वॉयस चैट पर वीडियो स्ट्रीमिंग शुरू करीं
  <b>/playforce -</b> फोर्स प्ले (वर्तमान बंद कर देला आ नया ट्रैक शुरू करेला)
  <b>/pause -</b> वर्तमान संगीत धारा के रोक दीं
  <b>/resume -</b> रुकल संगीत धारा के फिर से शुरू करीं
  <b>/skip -</b> वर्तमान ट्रैक के कतार में अगिला पर छोड़ दीं
  <b>/stop या /end -</b> संगीत बंद करीं आ पूरा कतार साफ करीं
  <b>/queue -</b> संगीत कतार में आवे वाला ट्रैक देखाईं
  <b>/shuffle -</b> बेतरतीब ढंग से संगीत कतार में फेरबदल करीं
  <b>/volume [1-200] -</b> बॉट के वॉल्यूम लेवल के समायोजित करीं
  <b>/loop [enable/disable] -</b> वर्तमान ट्रैक खातिर लूप के टॉगल करीं
  <b>/stream [link] -</b> सीधा लिंक से ऑडियो/वीडियो स्ट्रीम करीं
  <i>- स्ट्रीमिंग खातिर समर्थित प्रारूप : m3u8 आ अनुक्रमणिका लिंक।</i>
  <b>/seek [seconds] -</b> धारा के आगे भा पीछे ले जाईं
  <b>/seekback [सेकंड] -</b> धारा के पीछे के ओर खोजत बा
  <b>/speed -</b> प्लेबैक स्पीड बदलीं (जइसे कि, 0.5x, 1.0x, 2.0x)

  <b>💡चैनल प्ले:</b> उपसर्ग के रूप में c के प्रयोग करीं (जइसे कि /cplay)
  ────────────────────────────────

HELP_2: |-
  <b><u>एडमिन आ अधिकृत यूजर कमांड 🛠️</u></b>
  ────────────────────────────────

  <b>👤 <u>प्रशासक कमांड</u></b> के बा
  <b>/settings -</b> समूह सेटिंग पैनल खोलेला
  <b>/lang -</b> अपना समूह खातिर बॉट के भाषा बदलीं
  <b>/reload -</b> एडमिनलिस्ट आ कैश के रिफ्रेश करे ला
  <b>/adminlist -</b> चैट के वर्तमान एडमिन लिस्ट प्राप्त करीं
  <b>/ban_ghosts -</b> हटावल खाता के सफाई कइल

  <b>👤 <u>अधिकृत कमांड</u></b> के बा
  <b>/auth [उपयोगकर्ता] -</b> समूह के अधिकृत सूची में प्रयोगकर्ता के जोड़ल जाला
  <b>/unauth [User] -</b> कवनो प्रयोगकर्ता के अधिकृत सूची से हटावे ला।
  <b>/authusers -</b> अधिकृत प्रयोगकर्ता लोग के सूची देखावे ला
  <i>-ऑथ प्रयोगकर्ता लोग बिना एडमिन भइले एडमिन कमांड के इस्तेमाल कर सके ला।</i>

  <b>🤖 <u>बॉट कमांड:</u></b> के बा
  <b>/sudolist -</b> सभ सुडो प्रयोगकर्ता लोग के सूचीबद्ध करीं
  <b>/addsudo [उपयोगकर्ता] -</b> कवनो प्रयोगकर्ता के sudo सूची में जोड़ीं
  <b>/rmsudo [उपयोगकर्ता] -</b> कवनो प्रयोगकर्ता के sudo सूची से हटाईं

  <b>🌏 <u>ग्लोबल बैन फंक्शन:</u></b> के बा
  <b>/gban [उपयोगकर्ता के नाँव भा कौनों प्रयोगकर्ता के जवाब] -</b> बॉट के परोसल गइल चैट से कौनों प्रयोगकर्ता के Gban करीं आ ओकरा के आपके बॉट के इस्तेमाल करे से रोकीं
  <b>/ungban [उपयोगकर्ता के नाँव भा कौनों प्रयोगकर्ता के जवाब] -</b> कौनों प्रयोगकर्ता के बॉट के gbanned लिस्ट से हटाईं आ ओकरा के आपन बॉट के इस्तेमाल करे के अनुमति दीं
  <b>/gbannedusers -</b> Gbanned प्रयोगकर्ता सूची के जांच करीं

  <b>⚠️ <u>ब्लैकलिस्ट चैट फंक्शन:</u></b> के बा
  <b>/blacklistchat [CHAT_ID] -</b> म्यूजिक बॉट के इस्तेमाल से कवनो भी चैट के ब्लैकलिस्ट करीं
  <b>/whitelistchat [CHAT_ID] -</b> म्यूजिक बॉट के इस्तेमाल से कवनो ब्लैकलिस्ट कइल चैट के व्हाइटलिस्ट करीं
  <b>/blacklistedchats -</b> सभ ब्लैकलिस्ट कइल चैट के जांच करीं

  <b>🚫 <u>अवरुद्ध फंक्शन:</u></b> के बा
  <b>/block [उपयोगकर्ता के नाँव भा कौनों प्रयोगकर्ता के जवाब] -</b> प्रयोगकर्ता के बॉट कमांड के इस्तेमाल करे से रोके ला
  <b>/unblock [उपयोगकर्ता के नाँव भा कौनों प्रयोगकर्ता के जवाब] -</b> बॉट के अवरुद्ध सूची से कौनों प्रयोगकर्ता के हटाईं।
  <b>/blockedusers -</b> अवरुद्ध प्रयोगकर्ता सूची के जांच करीं

  <b>🌐 <u>प्रसारण कमांड</u></b> के बा
  <b>/broadcast [संदेश भा संदेश के जवाब] -</b> कवनो संदेश के बॉट के परोसल चैट में प्रसारित करीं

  <u>प्रसारण खातिर विकल्प:</u>
  <b>-pin -</b> एह से राउर संदेश पिन हो जाई
  <b>-pinloud -</b> एह से राउर संदेश जोर से सूचना के साथ पिन हो जाई
  <b>-user -</b> एह से राउर संदेश ओह प्रयोगकर्ता लोग के प्रसारित हो जाई जे राउर बॉट शुरू कइले बा
  <b>-assistant -</b> ई राउर बॉट के सहायक खाता से राउर संदेश प्रसारित करी
  <b>-nobot -</b> एह से राउर बॉट संदेश प्रसारित ना करे खातिर मजबूर हो जाई
  <b>उदाहरण:</b> <code>/broadcast -user -assistant -pin नमस्कार परीक्षण</code>
  ────────────────────────────────

HELP_3: |-
  <b><u>बॉट कमांड 🤖</u></b> के बा
  ────────────────────────────────

  <b>🤖 <u>बॉट कमांड</u></b> के बा
  <b>/karma -</b> कर्म के आँकड़ा
  <b>/lyrics [गीत के नाम] -</b> गीत के बोल प्राप्त करीं
  <b>/ping -</b> बॉट लेटेंस आ आँकड़ा के जांच करीं
  <b>/search [क्वेरी] -</b> यूट्यूब पर खोज करीं
  <b>/गीत भा /ytdl [नाम/लिंक] -</b> यूट्यूब ऑडियो/वीडियो डाउनलोड करीं

  <b>🕹️ <u>गैमिंग कमांड</u></b> के बा
  <b>/पासा -</b> एगो बेतरतीब पासा रोल करीं
  <b>/dart -</b> एगो डार्ट फेंकल जाला
  <b>/basketball -</b> कुछ घेरा गोली मारीं
  <b>/बॉलिंग -</b> गेंदबाजी खेले के बा
  <b>/फुटबॉल -</b> फुटबॉल खेले के बा
  <b>/slots -</b> स्लॉट पर आपन किस्मत आजमाईं
  <b>/ship या /couple -</b> अपना समूह में दिन के जोड़ी चुनीं

  <b>✨ <u>अतिरिक्त कमांड</u></b> के बा
  <b>/commit -</b> मजेदार कमिट संदेश जनरेट करीं
  <b>/carbon [text] -</b> कार्बन छवि बनाईं
  <b>/q या /quotly -</b> स्टिकर उद्धरण बनाईं
  <b>/random [lenght] -</b> यादृच्छिक जटिल पासवर्ड जनरेट करीं
  <b>/रन -</b> idk खुद के परीक्षण करीं
  <b>/tr [lang] [पाठ] -</b> पाठ के अनुवाद करीं
  <b>/id -</b> आपन यूजर आईडी भा ग्रुप आईडी ले लीं
  <b>/info [user] -</b> प्रयोगकर्ता के विस्तृत जानकारी प्राप्त करीं
  <b>/invite -</b> समूह आमंत्रण लिंक प्राप्त करीं।
  <b>/sticker_id -</b> स्टिकर फाइल आईडी प्राप्त करीं
  <b>/tts [text] -</b> पाठ के भाषण में बदल दीं
  <b>/genstr -</b> स्ट्रिंग सत्र (पाइरोग्राम/टेलीथॉन) जनरेट करीं
  <b>/reload -</b> एडमिन लिस्ट आ कैश के ताजा करीं

  <i>सूची समय के हिसाब से बढ़ी...</i>
  ────────────────────────────────

HELP_4: |-
  <b><u>सुडो कमांड 👮</u></b> के बा
  ────────────────────────────────

  <b>/activevc -</b> सक्रिय आवाज आ वीडियोचैट के सूचीबद्ध करीं
  <b>/speedtest -</b> सर्वर के गति के परीक्षण करीं
  <b>/stats -</b> बॉट के इस्तेमाल के आँकड़ा के जांच करीं
  <b>/logs -</b> डिबगिंग खातिर बॉट लॉग प्राप्त करीं
  <b>/autoend [enable|disable] -</b> अगर केहू सुनत नइखे त 3 मिनट के बाद ऑटो स्ट्रीम एंड सक्षम करीं
  <b>/logger [enable / disable] -</b> बॉट खोजल गइल क्वेरी सभ के लॉगर समूह में लॉग करे ला
  <b>/maintenance [सक्षम/अक्षम] -</b> रखरखाव मोड के टॉगल करीं
  ────────────────────────────────
