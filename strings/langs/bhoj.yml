HELP_1: '<b><u>संगीत 🎵</u></b>

  ───────────────────────────────────────────────


  /play भा /vplay : ऑडियो भा वीडियो स्ट्रीम शुरू करीं।

  /playforce : चलत गाना के रोक के नया गाना शुरू करीं।

  /pause : गाना रोकीं।

  /resume : रुकल गाना के फेर से शुरू करीं।

  /skip : अगिला गाना बजाईं।

  /stop : गाना बंद करीं अउर कतार साफ करीं।

  /queue : कतार देखीं।

  /shuffle : कतार के शफल करीं।

  /loop : लूप मोड चालू/बंद करीं।

  /seek : गाना के आगे/पीछे करीं।

  /speed : गाना के रफ़्तार बदलीं।


  चैनल खातिर कमांड के शुरू में <b>c</b> जोड़ीं।

  '
HELP_2: '<b><u>प्रमाणीकरण 👤</u></b>

  ───────────────────────────────────────────────


  /auth [यूजर] : यूजर के प्रमाणित लिस्ट में जोड़ीं।

  /unauth [यूजर] : प्रमाणित लिस्ट से हटाईं।

  /authusers : प्रमाणित यूजर लोगन के लिस्ट देखीं।

  '
HELP_3: '<b><u>प्रसारण 📢</u></b>

  ───────────────────────────────────────────────


  /broadcast [संडेस] : सब ग्रुप में संदेस भेजीं [सिर्फ सूडो]।

  <u>मोड्स:</u>

  <b>-pin</b> : संदेस पिन करीं।

  <b>-user</b> : यूजर लोगन के भेजीं।

  <b>-assistant</b> : सहायक खाता से भेजीं।

  '
HELP_4: '<b><u>एडमिन औजार 🛠️</u></b>

  ───────────────────────────────────────────────


  /settings : बॉट सेटिंग्स देखीं।

  /language : भाषा सेटिंग्स बदलीं।

  /refresh : एडमिन कैश रिफ्रेश करीं।

  /admincache : एडमिन कैश रिफ्रेश करीं।

  '
HELP_5: '<b><u>औजार 🧰</u></b>


  /song [नाम] : यूट्यूब से गाना डाउनलोड करीं।

  /lyrics [नाम] : गाना के बोल पाईं।

  /search [नाम] : यूट्यूब पर खोजीं।

  /video [नाम] : वीडियो खोजीं।

  /info [यूजर] : यूजर के जानकारी पाईं।

  /id : आपन भा चैट के आईडी पाईं।

  /carbon : लिखल शब्द के फोटो में बदलीं।

  /tr [भाषा] : अनुवाद करीं।

  /q : संदेस के स्टिकर कोट बनाईं।

  /genstr : स्ट्रिंग सेशन जनरेट करीं (Pyrogram/Telethon)।

  '

