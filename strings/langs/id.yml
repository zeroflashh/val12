  🖇**Group:** {0}

  🔖**ID Group:** `{1}`


  💡**Pilih tombol fungsi dari di bawah ini yang ingin Anda edit atau ubah.**'
setting_2: '» direct : plays search queries directly.


  » inline : returns inline buttons for choosing between video & audio.'
setting_3: '⁉️ Apa Ini?


  1) Langsung: Memutar kueri penelusuran secara langsung. Gunakan -v untuk memutar
  video dalam mode langsung.


  2) Sebaris: Mengembalikan Tombol Markup Sebaris untuk memilih antara video & audio.'
setting_4: '⁉️ Apa Ini?


  👥 Semua Orang: Siapa saja dapat menggunakan perintah admin (lewati, jeda, lanjutkan,
  dll.) yang ada di grup ini.


  🙍 Hanya Admin: Hanya admin dan pengguna yang berwenang yang dapat menggunakan perintah
  admin .'
setting_5: 'Tidak Ditemukan Pengguna Resmi


