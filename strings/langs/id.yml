HELP_1: |-
  <b><u>PERINTAH PEMUTARAN Musik 🎵</u></b>
  ────────────────────────────────

  <b>/play [Nama/Tautan] -</b> Mulai streaming audio di obrolan suara.
  <b>/vplay [Nama/Tautan] -</b> Mulai streaming video di obrolan suara
  <b>/playforce -</b> Putar paksa (menghentikan trek saat ini dan memulai trek baru)
  <b>/pause -</b> Menjeda streaming musik saat ini
  <b>/resume -</b> Melanjutkan aliran musik yang dijeda
  <b>/skip -</b> Lewati trek saat ini ke antrian berikutnya
  <b>/stop atau /end -</b> Hentikan musik dan hapus seluruh antrean
  <b>/queue -</b> Menampilkan lagu yang akan datang di antrean musik
  <b>/shuffle -</b> Mengacak antrean musik secara acak
  <b>/volume [1-200] -</b> Sesuaikan tingkat volume bot
  <b>/loop [aktifkan/nonaktifkan] -</b> Beralih loop untuk trek saat ini
  <b>/stream [link] -</b> Streaming audio/video dari tautan langsung
  <i>- format streaming yang didukung: m3u8 dan tautan indeks.</i>
  <b>/seek [detik] -</b> Memindahkan streaming ke depan atau ke belakang
  <b>/seekback [Detik] -</b> Mencari aliran mundur
  <b>/speed -</b> Mengubah kecepatan pemutaran (mis., 0,5x, 1,0x, 2,0x)

  <b>💡Pemutaran Saluran:</b> Gunakan c sebagai awalan (misalnya /cplay)
  ────────────────────────────────

HELP_2: |-
  <b><u>PERINTAH ADMIN DAN PENGGUNA RESMI 🛠️</u></b>
  ────────────────────────────────

  <b>👤 <u>Perintah Admin</u></b>
  <b>/settings -</b> Membuka panel pengaturan grup
  <b>/lang -</b> Ubah bahasa bot untuk grup Anda
  <b>/reload -</b> Menyegarkan daftar admin dan cache
  <b>/adminlist -</b> Dapatkan daftar admin obrolan saat ini
  <b>/ban_ghosts -</b> Bersihkan akun yang dihapus

  <b>👤 <u>Perintah Resmi</u></b>
  <b>/auth [Pengguna] -</b> Menambahkan pengguna ke daftar resmi grup
  <b>/unauth [Pengguna] -</b> Menghapus pengguna dari daftar resmi.
  <b>/authusers -</b> Menampilkan daftar pengguna yang berwenang
  <i>-Pengguna autentikasi dapat menggunakan perintah admin tanpa menjadi admin.</i>

  <b>🤖 <u>Perintah Bot:</u></b>
  <b>/sudolist -</b> Daftar semua pengguna sudo
  <b>/addsudo [Pengguna] -</b> Tambahkan pengguna ke daftar sudo
  <b>/rmsudo [Pengguna] -</b> Hapus pengguna dari daftar sudo

  <b>🌏 <u>Fungsi Larangan Global:</u></b>
  <b>/gban [Nama Pengguna atau Balasan ke pengguna] -</b> Blokir pengguna dari obrolan yang dilayani bot dan hentikan dia menggunakan bot Anda
  <b>/ungban [Nama Pengguna atau Balasan ke pengguna] -</b> Hapus pengguna dari Daftar Bot yang diblokir dan izinkan dia menggunakan bot Anda
  <b>/gbannedusers -</b> Periksa Daftar Pengguna yang Diblokir

  <b>⚠️ <u>Fungsi Obrolan Daftar Hitam:</u></b>
  <b>/blacklistchat [CHAT_ID] -</b> Masukkan semua chat ke dalam daftar hitam agar tidak menggunakan Bot Musik
  <b>/whitelistchat [CHAT_ID] -</b> Masukkan semua obrolan yang masuk daftar hitam ke dalam daftar putih agar tidak menggunakan Bot Musik
  <b>/blacklistedchats -</b> Periksa semua obrolan yang masuk daftar hitam

  <b>🚫 <u>Fungsi yang Diblokir:</u></b>
  <b>/block [Nama Pengguna atau Balasan ke pengguna] -</b> Mencegah pengguna menggunakan perintah bot
  <b>/buka blokir [Nama Pengguna atau Balasan ke pengguna] -</b> Hapus pengguna dari Daftar Blokir Bot.
  <b>/blockedusers -</b> Periksa Daftar Pengguna yang diblokir

  <b>🌐 <u>Perintah Siaran</u></b>
  <b>/broadcast [Pesan atau Balasan Pesan] -</b> Menyiarkan pesan apa pun ke Obrolan yang Disajikan Bot

  <u>Opsi untuk siaran:</u>
  <b>-pin -</b> Ini akan menyematkan pesan Anda
  <b>-pinloud -</b> Ini akan menyematkan pesan Anda dengan pemberitahuan keras
  <b>-user -</b> Ini akan menyiarkan pesan Anda ke pengguna yang telah memulai bot Anda
  <b>-assistant -</b> Ini akan menyiarkan pesan Anda dari akun asisten bot Anda
  <b>-nobot -</b> Ini akan memaksa bot Anda untuk tidak menyiarkan pesan
  <b>Contoh:</b> <code>/broadcast -user -assistant -pin Halo Pengujian</code>
  ────────────────────────────────

HELP_3: |-
  <b><u>PERINTAH BOT 🤖</u></b>
  ────────────────────────────────

  <b>🤖 <u>Perintah Bot</u></b>
  <b>/karma -</b> Statistik karma
  <b>/lyrics [Nama Lagu] -</b> Dapatkan lirik lagu
  <b>/ping -</b> Periksa latensi dan statistik bot
  <b>/search [Kueri] -</b> Telusuri di YouTube
  <b>/song atau /ytdl [Nama/Tautan] -</b> Unduh audio/video YouTube

  <b>🕹️ <u>Perintah Permainan</u></b>
  <b>/dadu -</b> Melempar dadu secara acak
  <b>/dart -</b> Melempar anak panah
  <b>/basketball -</b> Tembak beberapa rintangan
  <b>/bowling -</b> Mainkan bowling
  <b>/football -</b> Main sepak bola
  <b>/slots -</b> Cobalah keberuntungan Anda di slot
  <b>/ship atau /pair -</b> Pilih pasangan hari ini di grup Anda

  <b>✨ <u>Perintah Ekstra</u></b>
  <b>/commit -</b> Hasilkan Pesan Komit Lucu
  <b>/carbon [teks] -</b> Membuat gambar karbon
  <b>/q atau /quotly -</b> Membuat kutipan stiker
  <b>/random [panjang] -</b> Hasilkan Kata Sandi Kompleks Acak
  <b>/runs -</b> saya tidak menguji diri Anda sendiri
  <b>/tr [lang] [Teks] -</b> Terjemahkan teks
  <b>/id -</b> Dapatkan id pengguna atau id grup Anda
  <b>/info [pengguna] -</b> Dapatkan informasi pengguna secara detail
  <b>/invite -</b> Dapatkan tautan undangan grup.
  <b>/sticker_id -</b> Dapatkan ID file stiker
  <b>/tts [teks] -</b> Konversi Teks menjadi Ucapan
  <b>/genstr -</b> Menghasilkan Sesi String (Pyrogram/Telethon)
  <b>/reload -</b> Segarkan daftar admin dan cache

  <i>daftar akan bertambah seiring waktu...</i>
  ────────────────────────────────

HELP_4: |-
  <b><u>PERINTAH SUDO 👮</u></b>
  ────────────────────────────────

  <b>/activevc -</b> Mencantumkan obrolan suara dan video yang aktif
  <b>/speedtest -</b> Uji kecepatan server
  <b>/stats -</b> Periksa statistik penggunaan bot
  <b>/logs -</b> Dapatkan log bot untuk debugging
  <b>/autoend [aktifkan|nonaktifkan] -</b> Aktifkan Streaming otomatis berakhir setelah 3 menit jika tidak ada yang mendengarkan
  <b>/logger [aktifkan / nonaktifkan] -</b> Bot mencatat kueri yang dicari di grup logger
  <b>/maintenance [aktifkan/nonaktifkan] -</b> Alihkan mode pemeliharaan
  ────────────────────────────────
