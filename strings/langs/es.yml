HELP_1: '<b><u>COMANDOS DE REPRODUCCIÓN 🎵</u></b> <b>/play [Nombre/Enlace] -</b> Comenzar
  transmisión de audio en chat de voz. <b>/vplay [Nombre/Enlace] -</b> Comenzar transmisión
  de video en chat de voz. <b>/playforce -</b> Reproducción forzada (detiene la actual
  e inicia una nueva pista). <b>/pause -</b> Pausar la transmisión de música actual.
  <b>/resume -</b> Reanudar la transmisión de música pausada. <b>/skip -</b> Saltar
  la pista actual a la siguiente en cola. <b>/stop or /end -</b> Detener la música
  y limpiar toda la cola. <b>/mute -</b> Silenciar la transmisión actual para todos.
  <b>/unmute -</b> Quitar el silencio de la transmisión silenciada. <b>/queue -</b>
  Mostrar las pistas upcoming en la cola de música. <b>/shuffle -</b> Barajar aleatoriamente
  la cola de música. <b>/volume [1-200] -</b> Ajustar el nivel de volumen del bot.
  <b>/loop [enable/disable] -</b> Alternar bucle para la pista actual. <b>/seek [segundos]
  -</b> Mover la transmisión hacia adelante o atrás. <b>/seekback [Segundos] -</b>
  Buscar la transmisión hacia atrás. <b>/speed -</b> Cambiar la velocidad de reproducción
  (ej., 0.5x, 1.0x, 2.0x). 💡  <b>Reproducción por Canal:</b> Usa <b>c</b> como prefijo
  para reproducción por canal (ej. /cplay)

  ───────────────────────────────────────────────'
HELP_2: '<b><u>COMANDOS DE ADMIN Y USUARIOS AUTORIZADOS 🛠️</u></b> <b>👤 <u>Comandos
  de Admin</u></b> <b>/settings -</b> Abre el panel de configuración del grupo. <b>/language
  or /lang -</b> Cambiar el idioma del bot para tu grupo. <b>/reload -</b> Actualiza
  la lista de admins y la caché. <b>/adminlist -</b> Obtener la lista actual de admins
  del chat. <b>/ban_ghosts -</b> Limpiar cuentas eliminadas.

  ───────────────────────────────────────────────

  <b>👤 <u>COMANDOS AUTORIZADOS</u></b> <b>/auth [Usuario] -</b> Añade un usuario a
  la lista autorizada del grupo. <b>/unauth [Usuario] -</b> Elimina un usuario de
  la lista autorizada. <b>/authusers -</b> Muestra la lista de usuarios autorizados.

  <i>-Los usuarios autorizados pueden usar comandos de admin sin ser admin.</i>

  <b>🤖 <u>COMANDOS DEL BOT:</u></b> <b>/sudolist -</b> Listar todos los usuarios sudo.
  <b>/addsudo [Usuario] -</b> Añadir un usuario a la lista sudo. <b>/rmsudo [Usuario]
  -</b> Eliminar un usuario de la lista sudo.

  <b>👤 <u>FUNCIÓN DE BAN GLOBAL:</u></b> <b>/gban [Nombre de usuario o Responde a
  un usuario] -</b> Banear globalmente a un usuario de los chats servidos del bot.
  <b>/ungban [Nombre de usuario o Responde a un usuario] -</b> Eliminar un usuario
  de la Lista de Baneados Globales y permitirle usar el bot. <b>/gbannedusers -</b>
  Ver Lista de Usuarios Baneados Globalmente.

  <b>⚠️<u>FUNCIÓN DE LISTA NEGRA DE CHATS:</u></b> <b>/blacklistchat [ID_DE_CHAT]
  -</b> Poner cualquier chat en lista negra del Bot de Música. <b>/whitelistchat [ID_DE_CHAT]
  -</b> Quitar cualquier chat en lista negra del Bot de Música. <b>/blacklistedchat
  -</b> Ver todos los chats en lista negra.

  <b>👤 <u>FUNCIÓN DE BLOQUEADOS:</u></b> <b>/block [Nombre de usuario o Responde a
  un usuario] -</b> Previene que un usuario use los comandos del bot. <b>/unblock
  [Nombre de usuario o Responde a un usuario] -</b> Eliminar un usuario de la Lista
  de Bloqueados del Bot. <b>/blockedusers -</b> Ver Lista de Usuarios Bloqueados.

  <b>🌐 <u>COMANDOS DE TRANSMISIÓN</u></b> <b>/broadcast [Mensaje o Responde a un Mensaje]
  -</b> Transmitir cualquier mensaje a los Chats Servidos del Bot.

  <u>Opciones para transmitir:</u> <b>-pin -</b> Esto fijará tu mensaje. <b>-pinloud
  -</b> Esto fijará tu mensaje con notificación audible. <b>-user -</b> Esto transmitirá
  tu mensaje a los usuarios que han iniciado tu bot. <b>-assistant -</b> Esto transmitirá
  tu mensaje desde la cuenta asistente de tu bot. <b>-nobot -</b> Esto forzará a tu
  bot a no transmitir mensaje.

  <b>Ejemplo:</b> <code>/broadcast -user -assistant -pin Hola Prueba</code>'
HELP_3: '<b><u>COMANDOS DEL BOT 🤖</u></b> <b>🤖<u> Comandos del Bot</u></b>

  ───────────────────────────────────────────────

  <b>/karma -</b> Estadísticas de karma. <b>/lyrics [Nombre de canción] -</b> Obtener
  letras de canciones. <b>/ping -</b> Verificar latencia y estadísticas del bot. <b>/search
  [Consulta] -</b> Buscar en YouTube. <b>/ytdl or /song [Nombre/Enlace] -</b> Descargar
  audio/video de YouTube.



  <b>🕹️<u>Comandos de Juegos</u></b>

  <b>/dice -</b> Lanzar un dado aleatorio. <b>/dart -</b> Lanzar un dardo. <b>/basketball
  -</b> Lanzar unos aros. <b>/bowling -</b> Jugar bolos. <b>/football -</b> Jugar
  fútbol. <b>/slots -</b> Prueba tu suerte en las tragaperras. <b>/ship or /couple
  -</b> Elegir la pareja del día en tu grupo.


  <b>✨<u>Comandos Extra</u></b>

  <b>/commit -</b> Generar Mensajes de Commit Divertidos. <b>/carbon [Texto] -</b>
  Crear una imagen de carbono. <b>/kang -</b> Añadir sticker a tu paquete. <b>/q or
  /quotly -</b> Crear una cita de sticker. <b>/random [Longitud] -</b> Generar Contraseñas
  Complejas Aleatorias. <b>/runs -</b> No sé, pruébalo tú mismo. <b>/tr [Idioma] [Texto]
  -</b> Traducir texto.

  <b>/autocorrect [Responde a un msg] -</b> Autocorregir el texto en el msg respondido.
  <b>/eval [Código] -</b> Evaluar Código Python (Solo Propietario). <b>/id -</b> Obtener
  tu ID de usuario o ID de grupo. <b>/info [Usuario] -</b> Obtener información detallada
  del usuario. <b>/invite -</b> Obtener enlace de invitación del grupo. <b>/sticker_id
  -</b> Obtener ID del archivo del sticker. <b>/tts [texto] -</b> Convertir Texto
  a Voz.

  <b>/genstr -</b> Generar Sesión de String (Pyrogram/Telethon).

  <i>La lista crecerá con el tiempo...</i>'
HELP_4: '<b><u>COMANDOS SUDO 👮</u></b> <b>/activevc -</b> Listar chats de voz y video
  activos. <b>/speedtest -</b> Probar velocidad del servidor. <b>/stats or /gstats
  -</b> Ver estadísticas de uso del bot. <b>/logs -</b> Obtener registros del bot
  para depuración. <b>/autoend [enable|disable] -</b> Habilitar fin automático de
  transmisión después de 3 mins si nadie está escuchando. <b>/logger [enable / disable]
  -</b> El bot registra las consultas buscadas en el grupo de registros. <b>/maintenance
  [enable/disable] -</b> Alternar modo de mantenimiento. <b>/update -</b> Obtener
  las últimas actualizaciones de Git. <b>/vars -</b> Listar todas las variables de
  configuración. <b>/reboot or /restart -</b> Reiniciar el bot.

  ───────────────────────────────────────────────'

