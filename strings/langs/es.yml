HELP_1: |-
  <b><u>COMANDOS DE REPRODUCCIÓN DE MÚSICA 🎵</u></b>
  ───────────────────────────────

  <b>/play [Nombre/Enlace] -</b> Inicia la transmisión de audio en el chat de voz.
  <b>/vplay [Nombre/Enlace] -</b> Iniciar transmisión de video en el chat de voz
  <b>/playforce -</b> Fuerza la reproducción (detiene la pista actual y comienza una nueva)
  <b>/pause -</b> Pausa la transmisión de música actual
  <b>/resume -</b> Reanudar la transmisión de música pausada
  <b>/skip -</b> Salta la pista actual a la siguiente en la cola
  <b>/stop o /end -</b> Detiene la música y borra toda la cola
  <b>/queue -</b> Muestra las próximas pistas en la cola de música
  <b>/shuffle -</b> Mezcla aleatoriamente la cola de música
  <b>/volume [1-200] -</b> Ajusta el nivel de volumen de los bots
  <b>/loop [activar/desactivar] -</b> Alternar bucle para la pista actual
  <b>/stream [enlace] -</b> Transmite audio/vídeo desde un enlace directo
  <i>- formatos compatibles para streaming: m3u8 y enlaces de índice.</i>
  <b>/seek [segundos] -</b> Mueve la transmisión hacia adelante o hacia atrás
  <b>/seekback [Segundos] -</b> Busca la transmisión hacia atrás
  <b>/speed -</b> Cambia la velocidad de reproducción (por ejemplo, 0,5x, 1,0x, 2,0x)

  <b>💡Reproducción de canal:</b> Utilice c como prefijo (por ejemplo, /cplay)
  ───────────────────────────────

HELP_2: |-
  <b><u>COMANDOS DE ADMINISTRADOR Y USUARIO AUTORIZADO 🛠️</u></b>
  ───────────────────────────────

  <b>👤 <u>Comandos de administrador</u></b>
  <b>/settings -</b> Abre el panel de configuración del grupo
  <b>/lang -</b> Cambia el idioma del bot para tu grupo
  <b>/reload -</b> Actualiza la lista de administración y el caché
  <b>/adminlist -</b> Obtener la lista de administradores actuales del chat
  <b>/ban_ghosts -</b> Limpiar cuentas eliminadas

  <b>👤 <u>Comandos autorizados</u></b>
  <b>/auth [Usuario] -</b> Agrega un usuario a la lista autorizada del grupo
  <b>/unauth [Usuario] -</b> Elimina un usuario de la lista autorizada.
  <b>/authusers -</b> Muestra la lista de usuarios autorizados
  <i>-Los usuarios de autenticación pueden usar comandos de administrador sin ser administradores.</i>

  <b>🤖 <u>Comandos de bot:</u></b>
  <b>/sudolist -</b> Listar todos los usuarios de sudo
  <b>/addsudo [Usuario] -</b> Agregar un usuario a la lista de sudo
  <b>/rmsudo [Usuario] -</b> Eliminar un usuario de la lista de sudo

  <b>🌏 <u>Función de prohibición global:</u></b>
  <b>/gban [nombre de usuario o respuesta a un usuario] -</b> elimina a un usuario del chat servido del bot y evita que use tu bot
  <b>/ungban [Nombre de usuario o respuesta a un usuario] -</b> Eliminar un usuario de la lista gbaned del Bot y permitirle usar su bot
  <b>/gbannedusers -</b> Consultar listas de usuarios Gbanned

  <b>⚠️ <u>Función de chat de lista negra:</u></b>
  <b>/blacklistchat [CHAT_ID] -</b> Incluye en la lista negra cualquier chat que utilice Music Bot
  <b>/whitelistchat [CHAT_ID] -</b> Incluya en la lista blanca cualquier chat de la lista negra que no pueda usar Music Bot
  <b>/blacklistedchats -</b> Verificar todos los chats en la lista negra

  <b>🚫 <u>Función bloqueada:</u></b>
  <b>/block [Nombre de usuario o Responder a un usuario] -</b> Impide que un usuario utilice comandos de bot
  <b>/unblock [Nombre de usuario o Responder a un usuario] -</b> Eliminar un usuario de la lista de bloqueados del Bot.
  <b>/blockedusers -</b> Verificar listas de usuarios bloqueados

  <b>🌐 <u>Comandos de transmisión</u></b>
  <b>/broadcast [Mensaje o respuesta a un mensaje] -</b> Transmite cualquier mensaje a los chats servidos del Bot

  <u>Opciones de transmisión:</u>
  <b>-pin -</b> Esto fijará tu mensaje
  <b>-pinloud -</b> Esto fijará tu mensaje con una notificación en voz alta.
  <b>-user -</b> Esto transmitirá su mensaje a los usuarios que iniciaron su bot.
  <b>-assistant -</b> Esto transmitirá su mensaje desde la cuenta de asistente de su bot
  <b>-nobot -</b> Esto obligará a su bot a no transmitir mensajes
  <b>Ejemplo:</b> <code>/broadcast -user -assistant -pin Hola Prueba</code>
  ───────────────────────────────

HELP_3: |-
  <b><u>COMANDOS BOT 🤖</u></b>
  ───────────────────────────────

  <b>🤖 <u>Comandos de bot</u></b>
  <b>/karma -</b> Estadísticas de karma
  <b>/lyrics [Nombre de la canción] -</b> Obtener letras de canciones
  <b>/ping -</b> Verifica la latencia y las estadísticas del bot
  <b>/search [Consulta] -</b> Buscar en YouTube
  <b>/song o /ytdl [Nombre/Enlace] -</b> Descargar audio/vídeo de YouTube

  <b>🕹️ <u>Comandos de juego</u></b>
  <b>/dice -</b> Tira un dado al azar
  <b>/dart -</b> Lanzar un dardo
  <b>/basketball -</b> Lanza algunos aros
  <b>/bowling -</b> Jugar a los bolos
  <b>/football -</b> Jugar al fútbol
  <b>/slots -</b> Prueba suerte en las tragamonedas
  <b>/barco o /pareja -</b> Elige la pareja del día en tu grupo

  <b>✨ <u>Comandos adicionales</u></b>
  <b>/commit -</b> Genera mensajes de confirmación divertidos
  <b>/carbon [texto] -</b> Crear una imagen de carbono
  <b>/q o /quotly -</b> Crear una cotización de calcomanía
  <b>/random [longitud] -</b> Generar contraseñas complejas aleatorias
  <b>/runs -</b> No sé, ponte a prueba
  <b>/tr [lang] [Texto] -</b> Traducir texto
  <b>/id -</b> Obtenga su ID de usuario o ID de grupo
  <b>/info [usuario] -</b> Obtener información detallada del usuario
  <b>/invite -</b> Obtener enlace de invitación al grupo.
  <b>/sticker_id -</b> Obtener ID del archivo de calcomanía
  <b>/tts [texto] -</b> Convertir texto en voz
  <b>/genstr -</b> Generar sesión de cadena (Pyrogram/Telethon)
  <b>/reload -</b> Actualizar la lista de administradores y el caché

  <i>la lista crecerá con el tiempo...</i>
  ───────────────────────────────

HELP_4: |-
  <b><u>COMANDOS SUDO 👮</u></b>
  ───────────────────────────────

  <b>/activevc -</b> Lista de chats de voz y vídeo activos
  <b>/speedtest -</b> Prueba la velocidad del servidor
  <b>/stats -</b> Consulta las estadísticas de uso del bot
  <b>/logs -</b> Obtener registros de bot para depurar
  <b>/autoend [enable|disable] -</b> Habilite la finalización automática de la transmisión después de 3 minutos si no hay nadie escuchando
  <b>/logger [activar/desactivar] -</b> Bot registra las consultas buscadas en el grupo de registradores
  <b>/maintenance [activar/desactivar] -</b> Alternar modo de mantenimiento
  ───────────────────────────────
