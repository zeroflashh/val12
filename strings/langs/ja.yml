HELP_1: |-
  <b><u>音楽再生コマンド 🎵</u></b>
  ─────────────

  <b>/play [名前/リンク] -</b> ボイスチャットでオーディオのストリーミングを開始します。
  <b>/vplay [名前/リンク] -</b> ボイスチャットでビデオのストリーミングを開始します
  <b>/playforce -</b> 強制再生 (現在のトラックを停止し、新しいトラックを開始します)
  <b>/pause -</b> 現在の音楽ストリームを一時停止します
  <b>/resume -</b> 一時停止した音楽ストリームを再開します
  <b>/skip -</b> 現在のトラックをキュー内の次のトラックにスキップします
  <b>/stop または /end -</b> 音楽を停止し、キュー全体をクリアします
  <b>/queue -</b> 音楽キュー内の今後のトラックを表示します
  <b>/shuffle -</b> 音楽キューをランダムにシャッフルします
  <b>/volume [1-200] -</b> ボットの音量レベルを調整します。
  <b>/loop [有効/無効] -</b> 現在のトラックのループを切り替えます
  <b>/stream [link] -</b> 直接リンクからオーディオ/ビデオをストリーミングします。
  <i>- ストリーミングでサポートされている形式: m3u8 およびインデックス リンク。</i>
  <b>/seek [秒] -</b> ストリームを前後に移動します
  <b>/seekback [秒] -</b> ストリームを逆方向にシークします
  <b>/speed -</b> 再生速度を変更します (例: 0.5x、1.0x、2.0x)

  <b>💡チャンネル再生:</b> プレフィックスとして c を使用します (例: /cplay)
  ─────────────

HELP_2: |-
  <b><u>管理者および許可されたユーザーのコマンド 🛠️</u></b>
  ─────────────

  <b>👤 <u>管理者コマンド</u></b>
  <b>/settings -</b> グループ設定パネルを開きます
  <b>/lang -</b> グループのボットの言語を変更します
  <b>/reload -</b> 管理者リストとキャッシュを更新します。
  <b>/adminlist -</b> チャットの現在の管理者リストを取得します。
  <b>/ban_ghosts -</b> 削除されたアカウントをクリーンアップする

  <b>👤 <u>承認されたコマンド</u></b>
  <b>/auth [ユーザー] -</b> グループの承認済みリストにユーザーを追加します。
  <b>/unauth [ユーザー] -</b> 承認済みリストからユーザーを削除します。
  <b>/authusers -</b> 許可されたユーザーのリストを表示します。
  <i>- 認証ユーザーは管理者でなくても管理コマンドを使用できます。</i>

  <b>🤖 <u>ボット コマンド:</u></b>
  <b>/sudolist -</b> すべての sudo ユーザーをリストします。
  <b>/addsudo [ユーザー] -</b> sudo リストにユーザーを追加します。
  <b>/rmsudo [ユーザー] -</b> sudo リストからユーザーを削除します

  <b>🌏 <u>グローバル禁止機能:</u></b>
  <b>/gban [ユーザー名またはユーザーへの返信] -</b> ボットが提供するチャットからユーザーを禁止し、ボットの使用を停止します。
  <b>/ungban [ユーザー名またはユーザーへの返信] -</b> ボットの禁止リストからユーザーを削除し、ボットの使用を許可します。
  <b>/gbannedusers -</b> 禁止ユーザー リストを確認する

  <b>⚠️ <u>ブラックリスト チャット機能:</u></b>
  <b>/blacklistchat [CHAT_ID] -</b> Music Bot を使用したチャットをブラックリストに登録します
  <b>/whitelistchat [CHAT_ID] -</b> ブラックリストに登録されているチャットをミュージック ボットの使用からホワイトリストに登録します
  <b>/blacklistedchats -</b> ブラックリストに登録されたチャットをすべてチェックします

  <b>🚫 <u>ブロックされた機能:</u></b>
  <b>/block [ユーザー名またはユーザーへの返信] -</b> ユーザーがボット コマンドを使用できないようにします。
  <b>/unblock [ユーザー名またはユーザーへの返信] -</b> ボットのブロックリストからユーザーを削除します。
  <b>/blockedusers -</b> ブロックされたユーザーのリストを確認します

  <b>🌐 <u>ブロードキャスト コマンド</u></b>
  <b>/broadcast [メッセージまたはメッセージへの返信] -</b> ボットのサービス付きチャットにメッセージをブロードキャストします。

  <u>ブロードキャストのオプション:</u>
  <b>-pin -</b> メッセージを固定します。
  <b>-pinloud -</b> 大音量の通知とともにメッセージを固定します
  <b>-user -</b> ボットを開始したユーザーにメッセージをブロードキャストします。
  <b>-assistant -</b> ボットのアシスタント アカウントからメッセージをブロードキャストします。
  <b>-nobot -</b> これにより、ボットがメッセージをブロードキャストしなくなります。
  <b>例:</b> <code>/broadcast -user -assistant -pin Hello テスト</code>
  ─────────────

HELP_3: |-
  <b><u>ボット コマンド 🤖</u></b>
  ─────────────

  <b>🤖 <u>ボット コマンド</u></b>
  <b>/karma -</b> カルマ統計
  <b>/lyrics [曲名] -</b> 曲の歌詞を取得します
  <b>/ping -</b> ボットの遅延と統計を確認します
  <b>/search [クエリ] -</b> YouTube で検索
  <b>/song または /ytdl [名前/リンク] -</b> YouTube オーディオ/ビデオをダウンロードします

  <b>🕹️ <u>ゲーム コマンド</u></b>
  <b>/dice -</b> ランダムなサイコロを振る
  <b>/dart -</b> ダーツを投げます
  <b>/バスケットボール -</b> フープをいくつかシュートしましょう
  <b>/ボウリング -</b> ボウリングをする
  <b>/フットボール -</b> フットボールをする
  <b>/slots -</b> スロットで運試ししてみましょう
  <b>/ship または /couple -</b> グループ内のその日のカップルを選択してください

  <b>✨ <u>追加コマンド</u></b>
  <b>/commit -</b> 面白いコミット メッセージを生成します
  <b>/carbon [text] -</b> カーボン イメージを作成します
  <b>/q または /quotly -</b> ステッカーの引用を作成します
  <b>/random [length] -</b> ランダムな複雑なパスワードを生成します
  <b>/runs -</b> 自分で IDK テストを行います
  <b>/tr [lang] [テキスト] -</b> テキストを翻訳します
  <b>/id -</b> ユーザー ID またはグループ ID を取得します
  <b>/info [ユーザー] -</b> 詳細なユーザー情報を取得します
  <b>/invite -</b> グループ招待リンクを取得します。
  <b>/sticker_id -</b> ステッカー ファイル ID を取得します
  <b>/tts [テキスト] -</b> テキストを音声に変換
  <b>/genstr -</b> 文字列セッションを生成 (Pyrogram/Telethon)
  <b>/reload -</b> 管理者リストとキャッシュを更新します

  <i>リストは時間の経過とともに増加します...</i>
  ─────────────

HELP_4: |-
  <b><u>SUDO コマンド 👮</u></b>
  ─────────────

  <b>/activevc -</b> アクティブな音声チャットとビデオチャットをリストします。
  <b>/speedtest -</b> サーバーの速度をテストします
  <b>/stats -</b> ボットの使用統計を確認します
  <b>/logs -</b> デバッグ用のボット ログを取得します
  <b>/autoend [enable|disable] -</b> 誰も聞いていない場合、3 分後に自動ストリーム終了を有効にします
  <b>/logger [有効 / 無効] -</b> ボットは検索されたクエリをロガー グループに記録します。
  <b>/maintenance [有効/無効] -</b> メンテナンス モードを切り替えます
  ─────────────
