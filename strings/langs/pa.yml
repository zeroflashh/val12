  <b>/seekback [ਸਕਿੰਟ] -</b> ਸਟ੍ਰੀਮ ਨੂੰ ਪਿੱਛੇ ਵੱਲ ਭਾਲਦਾ ਹੈ
  <b>/ਸਪੀਡ -</b> ਪਲੇਬੈਕ ਸਪੀਡ ਬਦਲੋ (ਉਦਾਹਰਨ ਲਈ, 0.5x, 1.0x, 2.0x)

  <b>💡ਚੈਨਲ ਪਲੇ:</b> c ਨੂੰ ਅਗੇਤਰ ਵਜੋਂ ਵਰਤੋ (ਉਦਾਹਰਨ ਲਈ /cplay)
  ──────────────────────────────────

HELP_2: |-
  <b><u>ਪ੍ਰਸ਼ਾਸਕ ਅਤੇ ਅਧਿਕਾਰਤ ਵਰਤੋਂਕਾਰ ਕਮਾਂਡਾਂ 🛠️</u></b>
  ──────────────────────────────────

  <b>👤 <u>ਐਡਮਿਨ ਕਮਾਂਡਾਂ</u></b>
  <b>/settings -</b> ਗਰੁੱਪ ਸੈਟਿੰਗ ਪੈਨਲ ਨੂੰ ਖੋਲ੍ਹਦਾ ਹੈ
  <b>/lang -</b> ਆਪਣੇ ਸਮੂਹ ਲਈ ਬੋਟ ਦੀ ਭਾਸ਼ਾ ਬਦਲੋ
  <b>/ਰੀਲੋਡ -</b> ਐਡਮਿਨਲਿਸਟ ਅਤੇ ਕੈਸ਼ ਨੂੰ ਤਾਜ਼ਾ ਕਰਦਾ ਹੈ
  <b>/adminlist -</b> ਚੈਟ ਦੀ ਮੌਜੂਦਾ ਪ੍ਰਬੰਧਕ ਸੂਚੀ ਪ੍ਰਾਪਤ ਕਰੋ
  <b>/ban_ghosts -</b> ਮਿਟਾਏ ਗਏ ਖਾਤਿਆਂ ਨੂੰ ਸਾਫ਼ ਕਰੋ

  <b>👤 <u>ਅਧਿਕਾਰਤ ਕਮਾਂਡਾਂ</u></b>
  <b>/auth [User] -</b> ਸਮੂਹ ਦੀ ਅਧਿਕਾਰਤ ਸੂਚੀ ਵਿੱਚ ਇੱਕ ਉਪਭੋਗਤਾ ਨੂੰ ਜੋੜਦਾ ਹੈ
  <b>/unauth [ਉਪਭੋਗਤਾ] -</b> ਅਧਿਕਾਰਤ ਸੂਚੀ ਵਿੱਚੋਂ ਇੱਕ ਉਪਭੋਗਤਾ ਨੂੰ ਹਟਾਉਂਦਾ ਹੈ।
  <b>/authusers -</b> ਅਧਿਕਾਰਤ ਵਰਤੋਂਕਾਰਾਂ ਦੀ ਸੂਚੀ ਦਿਖਾਉਂਦਾ ਹੈ
  <i>-Auth ਵਰਤੋਂਕਾਰ ਐਡਮਿਨ ਹੋਣ ਤੋਂ ਬਿਨਾਂ ਐਡਮਿਨ ਕਮਾਂਡਾਂ ਦੀ ਵਰਤੋਂ ਕਰ ਸਕਦੇ ਹਨ।</i>

  <b>🤖 <u>ਬੋਟ ਕਮਾਂਡਾਂ:</u></b>
  <b>/sudolist -</b> ਸਾਰੇ sudo ਉਪਭੋਗਤਾਵਾਂ ਦੀ ਸੂਚੀ ਬਣਾਓ
  <b>/addsudo [User] -</b> sudo ਸੂਚੀ ਵਿੱਚ ਇੱਕ ਉਪਭੋਗਤਾ ਸ਼ਾਮਲ ਕਰੋ
  <b>/rmsudo [User] -</b> sudo ਸੂਚੀ ਵਿੱਚੋਂ ਇੱਕ ਉਪਭੋਗਤਾ ਨੂੰ ਹਟਾਓ

  <b>🌏 <u>ਗਲੋਬਲ ਬੈਨ ਫੰਕਸ਼ਨ:</u></b>
  <b>/gban [ਉਪਭੋਗਤਾ ਨਾਮ ਜਾਂ ਵਰਤੋਂਕਾਰ ਨੂੰ ਜਵਾਬ ਦਿਓ] -</b> ਬੋਟ ਦੀ ਸੇਵਾ ਕੀਤੀ ਚੈਟ ਤੋਂ ਉਪਭੋਗਤਾ ਨੂੰ Gban ਕਰੋ ਅਤੇ ਉਸਨੂੰ ਆਪਣੇ ਬੋਟ ਦੀ ਵਰਤੋਂ ਕਰਨ ਤੋਂ ਰੋਕੋ
  <b>/ungban [ਉਪਭੋਗਤਾ ਨਾਮ ਜਾਂ ਉਪਭੋਗਤਾ ਨੂੰ ਜਵਾਬ ਦਿਓ] -</b> ਬੋਟ ਦੀ gban ਕੀਤੀ ਸੂਚੀ ਵਿੱਚੋਂ ਇੱਕ ਉਪਭੋਗਤਾ ਨੂੰ ਹਟਾਓ ਅਤੇ ਉਸਨੂੰ ਆਪਣੇ ਬੋਟ ਦੀ ਵਰਤੋਂ ਕਰਨ ਦੀ ਆਗਿਆ ਦਿਓ
  <b>/gbannedusers -</b> Gbanned ਉਪਭੋਗਤਾ ਸੂਚੀਆਂ ਦੀ ਜਾਂਚ ਕਰੋ

  <b>⚠️ <u>ਬਲੈਕਲਿਸਟ ਚੈਟ ਫੰਕਸ਼ਨ:</u></b>
  <b>/blacklistchat [CHAT_ID] -</b> ਸੰਗੀਤ ਬੋਟ ਦੀ ਵਰਤੋਂ ਕਰਨ ਤੋਂ ਕਿਸੇ ਵੀ ਚੈਟ ਨੂੰ ਬਲੈਕਲਿਸਟ ਕਰੋ
  <b>/whitelistchat [CHAT_ID] -</b> ਸੰਗੀਤ ਬੋਟ ਦੀ ਵਰਤੋਂ ਕਰਨ ਤੋਂ ਕਿਸੇ ਵੀ ਬਲੈਕਲਿਸਟਡ ਚੈਟ ਨੂੰ ਵਾਈਟਲਿਸਟ ਕਰੋ
  <b>/ਕਾਲੀ ਸੂਚੀਬੱਧ ਚੈਟਸ -</b> ਸਾਰੀਆਂ ਬਲੈਕਲਿਸਟ ਕੀਤੀਆਂ ਚੈਟਾਂ ਦੀ ਜਾਂਚ ਕਰੋ

  <b>🚫 <u>ਬਲੌਕ ਕੀਤਾ ਫੰਕਸ਼ਨ:</u></b>
  <b>/ਬਲਾਕ [ਉਪਭੋਗਤਾ ਨਾਮ ਜਾਂ ਉਪਭੋਗਤਾ ਨੂੰ ਜਵਾਬ ਦਿਓ] -</b> ਉਪਭੋਗਤਾ ਨੂੰ ਬੋਟ ਕਮਾਂਡਾਂ ਦੀ ਵਰਤੋਂ ਕਰਨ ਤੋਂ ਰੋਕਦਾ ਹੈ
  <b>/ਅਨਬਲੌਕ [ਉਪਭੋਗਤਾ ਨਾਮ ਜਾਂ ਉਪਭੋਗਤਾ ਨੂੰ ਜਵਾਬ ਦਿਓ] -</b> ਬੋਟ ਦੀ ਬਲੌਕ ਕੀਤੀ ਸੂਚੀ ਵਿੱਚੋਂ ਇੱਕ ਉਪਭੋਗਤਾ ਨੂੰ ਹਟਾਓ।
  <b>/blockedusers -</b> ਬਲਾਕ ਕੀਤੇ ਉਪਭੋਗਤਾ ਸੂਚੀਆਂ ਦੀ ਜਾਂਚ ਕਰੋ

  <b>🌐 <u>ਬਰਾਡਕਾਸਟ ਕਮਾਂਡਾਂ</u></b>
  <b>/ਪ੍ਰਸਾਰਣ [ਸੰਦੇਸ਼ ਜਾਂ ਸੰਦੇਸ਼ ਦਾ ਜਵਾਬ ਦਿਓ] -</b> ਬੋਟ ਦੀਆਂ ਦਿੱਤੀਆਂ ਗਈਆਂ ਚੈਟਾਂ ਵਿੱਚ ਕੋਈ ਵੀ ਸੁਨੇਹਾ ਪ੍ਰਸਾਰਿਤ ਕਰੋ

  <u>ਪ੍ਰਸਾਰਣ ਲਈ ਵਿਕਲਪ:</u>
  <b>-ਪਿੰਨ -</b> ਇਹ ਤੁਹਾਡੇ ਸੁਨੇਹੇ ਨੂੰ ਪਿੰਨ ਕਰੇਗਾ
  <b>-pinloud -</b> ਇਹ ਤੁਹਾਡੇ ਸੁਨੇਹੇ ਨੂੰ ਉੱਚੀ ਸੂਚਨਾ ਦੇ ਨਾਲ ਪਿੰਨ ਕਰੇਗਾ
  <b>-ਉਪਭੋਗਤਾ -</b> ਇਹ ਤੁਹਾਡੇ ਸੰਦੇਸ਼ ਨੂੰ ਉਹਨਾਂ ਉਪਭੋਗਤਾਵਾਂ ਨੂੰ ਪ੍ਰਸਾਰਿਤ ਕਰੇਗਾ ਜਿਨ੍ਹਾਂ ਨੇ ਤੁਹਾਡਾ ਬੋਟ ਸ਼ੁਰੂ ਕੀਤਾ ਹੈ
  <b>-ਸਹਾਇਕ -</b> ਇਹ ਤੁਹਾਡੇ ਬੋਟ ਦੇ ਸਹਾਇਕ ਖਾਤੇ ਤੋਂ ਤੁਹਾਡੇ ਸੰਦੇਸ਼ ਨੂੰ ਪ੍ਰਸਾਰਿਤ ਕਰੇਗਾ
  <b>-nobot -</b> ਇਹ ਤੁਹਾਡੇ ਬੋਟ ਨੂੰ ਸੁਨੇਹਾ ਪ੍ਰਸਾਰਿਤ ਨਾ ਕਰਨ ਲਈ ਮਜ਼ਬੂਰ ਕਰੇਗਾ
  <b>ਉਦਾਹਰਨ:</b> <code>/broadcast -user -assistant -pin ਹੈਲੋ ਟੈਸਟਿੰਗ</code>
  ──────────────────────────────────

HELP_3: |-
  <b><u>BOT ਹੁਕਮ 🤖</u></b>
  ──────────────────────────────────

  <b>🤖 <u>ਬੋਟ ਕਮਾਂਡਾਂ</u></b>
  <b>/ਕਰਮ -</b> ਕਰਮ ਅੰਕੜੇ
  <b>/ਗੀਤ [ਗੀਤ ਦਾ ਨਾਮ] -</b> ਗੀਤ ਦੇ ਬੋਲ ਪ੍ਰਾਪਤ ਕਰੋ
  <b>/ਪਿੰਗ -</b> ਬੋਟ ਲੇਟੈਂਸੀ ਅਤੇ ਅੰਕੜਿਆਂ ਦੀ ਜਾਂਚ ਕਰੋ
  <b>/ਖੋਜ [Query] -</b> YouTube 'ਤੇ ਖੋਜ ਕਰੋ
  <b>/ਗੀਤ ਜਾਂ /ytdl [ਨਾਮ/ਲਿੰਕ] -</b> YouTube ਆਡੀਓ/ਵੀਡੀਓ ਡਾਊਨਲੋਡ ਕਰੋ

  <b>🕹️ <u>ਗੇਮਿੰਗ ਕਮਾਂਡਾਂ</u></b>
  <b>/ਪਾਸੇ -</b> ਇੱਕ ਬੇਤਰਤੀਬ ਪਾਸਾ ਰੋਲ ਕਰੋ
  <b>/ਡਾਰਟ -</b> ਇੱਕ ਡਾਰਟ ਸੁੱਟੋ
  <b>/ਬਾਸਕਟਬਾਲ -</b> ਕੁਝ ਹੂਪਸ ਸ਼ੂਟ ਕਰੋ
  <b>/ਬੋਲਿੰਗ -</b> ਗੇਂਦਬਾਜ਼ੀ ਖੇਡੋ
  <b>/ਫੁੱਟਬਾਲ -</b> ਫੁੱਟਬਾਲ ਖੇਡੋ
  <b>/ਸਲਾਟ -</b> ਸਲਾਟਾਂ 'ਤੇ ਆਪਣੀ ਕਿਸਮਤ ਅਜ਼ਮਾਓ
  <b>/ਜਹਾਜ਼ ਜਾਂ /ਜੋੜਾ -</b> ਆਪਣੇ ਸਮੂਹ ਵਿੱਚ ਦਿਨ ਦੇ ਜੋੜੇ ਨੂੰ ਚੁਣੋ

  <b>✨ <u>ਵਾਧੂ ਕਮਾਂਡਾਂ</u></b>
  <b>/ਕਮਿਟ -</b> ਮਜ਼ੇਦਾਰ ਕਮਿਟ ਸੁਨੇਹੇ ਤਿਆਰ ਕਰੋ
  <b>/ਕਾਰਬਨ [ਟੈਕਸਟ] -</b> ਇੱਕ ਕਾਰਬਨ ਚਿੱਤਰ ਬਣਾਓ
  <b>/q ਜਾਂ /quotly -</b> ਇੱਕ ਸਟਿੱਕਰ ਹਵਾਲਾ ਬਣਾਓ
  <b>/ਰੈਂਡਮ [ਲੰਬਾਈ] -</b> ਰੈਂਡਮ ਕੰਪਲੈਕਸ ਪਾਸਵਰਡ ਬਣਾਓ
  <b>/ਰਨਸ -</b> idk ਆਪਣੇ ਆਪ ਦੀ ਜਾਂਚ ਕਰੋ
  <b>/tr [lang] [ਟੈਕਸਟ] -</b> ਟੈਕਸਟ ਦਾ ਅਨੁਵਾਦ ਕਰੋ
  <b>/id -</b> ਆਪਣੀ ਯੂਜ਼ਰ ਆਈਡੀ ਜਾਂ ਗਰੁੱਪ ਆਈਡੀ ਪ੍ਰਾਪਤ ਕਰੋ
  <b>/info [user] -</b> ਵਿਸਤ੍ਰਿਤ ਉਪਭੋਗਤਾ ਜਾਣਕਾਰੀ ਪ੍ਰਾਪਤ ਕਰੋ
  <b>/invite -</b> ਸਮੂਹ ਸੱਦਾ ਲਿੰਕ ਪ੍ਰਾਪਤ ਕਰੋ।
  <b>/sticker_id -</b> ਸਟਿੱਕਰ ਫਾਈਲ ID ਪ੍ਰਾਪਤ ਕਰੋ
  <b>/tts [text] -</b> ਟੈਕਸਟ ਨੂੰ ਸਪੀਚ ਵਿੱਚ ਬਦਲੋ
  <b>/genstr -</b> ਸਟ੍ਰਿੰਗ ਸੈਸ਼ਨ ਤਿਆਰ ਕਰੋ (ਪਾਇਰੋਗ੍ਰਾਮ/ਟੈਲੀਥਨ)
  <b>/ਰੀਲੋਡ ਕਰੋ -</b> ਐਡਮਿਨ ਸੂਚੀ ਅਤੇ ਕੈਸ਼ ਨੂੰ ਤਾਜ਼ਾ ਕਰੋ

  <i>ਸੂਚੀ ਸਮੇਂ ਨਾਲ ਵਧੇਗੀ...</i>
  ──────────────────────────────────

HELP_4: |-
