  <b>/speedtest -</b> ਸਰਵਰ ਦੀ ਗਤੀ ਦੀ ਜਾਂਚ ਕਰੋ
  <b>/ਅੰਕੜੇ -</b> ਬੋਟ ਵਰਤੋਂ ਦੇ ਅੰਕੜਿਆਂ ਦੀ ਜਾਂਚ ਕਰੋ
  <b>/ਲੌਗਸ -</b> ਡੀਬੱਗਿੰਗ ਲਈ ਬੋਟ ਲੌਗ ਪ੍ਰਾਪਤ ਕਰੋ
  <b>/autoend [enable|disable] -</b> ਜੇਕਰ ਕੋਈ ਨਹੀਂ ਸੁਣ ਰਿਹਾ ਤਾਂ 3 ਮਿੰਟਾਂ ਬਾਅਦ ਆਟੋ ਸਟ੍ਰੀਮ ਨੂੰ ਚਾਲੂ ਕਰੋ
  <b>/ਲੌਗਰ [ਸਮਰੱਥ / ਅਸਮਰੱਥ] -</b> ਬੋਟ ਲੌਗਰ ਸਮੂਹ ਵਿੱਚ ਖੋਜੀ ਪੁੱਛਗਿੱਛਾਂ ਨੂੰ ਲੌਗ ਕਰਦਾ ਹੈ
  <b>/ਸੰਭਾਲ [ਯੋਗ/ਅਯੋਗ] -</b> ਰੱਖ-ਰਖਾਅ ਮੋਡ ਨੂੰ ਟੌਗਲ ਕਰੋ
  ──────────────────────────────────
