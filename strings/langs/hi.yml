HELP_1: |-
  <b><u>म्यूजिक प्ले कमांड 🎵</u></b>
  ──────────────────────────────

  <b>/चलाएं [नाम/लिंक] -</b> वॉइस चैट पर ऑडियो स्ट्रीम करना प्रारंभ करें।
  <b>/vplay [नाम/लिंक] -</b> वॉयस चैट पर वीडियो स्ट्रीमिंग शुरू करें
  <b>/प्लेफोर्स -</b> फोर्स प्ले (वर्तमान को रोकता है और नया ट्रैक शुरू करता है)
  <b>/रोकें -</b> वर्तमान संगीत स्ट्रीम को रोकें
  <b>/resume -</b> रुकी हुई संगीत स्ट्रीम को फिर से शुरू करें
  <b>/छोड़ें -</b> वर्तमान ट्रैक को कतार में अगले ट्रैक पर छोड़ें
  <b>/स्टॉप या /एंड -</b> संगीत बंद करें और पूरी कतार साफ़ करें
  <b>/कतार -</b> संगीत कतार में आगामी ट्रैक दिखाएं
  <b>/फेरबदल -</b> संगीत कतार को बेतरतीब ढंग से फेरबदल करें
  <b>/वॉल्यूम [1-200] -</b> बॉट्स वॉल्यूम स्तर को समायोजित करें
  <b>/लूप [सक्षम/अक्षम] -</b> वर्तमान ट्रैक के लिए लूप टॉगल करें
  <b>/स्ट्रीम [लिंक] -</b> सीधे लिंक से ऑडियो/वीडियो स्ट्रीम करें
  <i>- स्ट्रीमिंग के लिए समर्थित प्रारूप: m3u8 और इंडेक्स लिंक।</i>
  <b>/खोजें [सेकंड] -</b> धारा को आगे या पीछे ले जाएं
  <b>/सीकबैक [सेकंड] -</b> धारा को पीछे की ओर ढूंढ़ता है
  <b>/गति -</b> प्लेबैक गति बदलें (उदाहरण के लिए, 0.5x, 1.0x, 2.0x)

  <b>💡चैनल प्ले:</b> c को उपसर्ग के रूप में उपयोग करें (उदा. /cplay)
  ──────────────────────────────

HELP_2: |-
  <b><u>व्यवस्थापक और अधिकृत उपयोगकर्ता आदेश 🛠️</u></b>
  ──────────────────────────────

  <b>👤 <u>एडमिन कमांड</u></b>
  <b>/सेटिंग्स -</b> समूह सेटिंग पैनल खोलता है
  <b>/lang -</b> अपने समूह के लिए बॉट की भाषा बदलें
  <b>/पुनः लोड करें -</b> व्यवस्थापक सूची और कैश को ताज़ा करता है
  <b>/adminlist -</b> चैट की वर्तमान व्यवस्थापक सूची प्राप्त करें
  <b>/ban_ghosts -</b> हटाए गए खातों को साफ़ करें

  <b>👤 <u>अधिकृत आदेश</u></b>
  <b>/auth [उपयोगकर्ता] -</b> एक उपयोगकर्ता को समूह की अधिकृत सूची में जोड़ता है
  <b>/अप्रमाणित [उपयोगकर्ता] -</b> किसी उपयोगकर्ता को अधिकृत सूची से हटा देता है।
  <b>/लेखक -</b> अधिकृत उपयोगकर्ताओं की सूची दिखाता है
  <i>-प्रामाणिक उपयोगकर्ता व्यवस्थापक बने बिना व्यवस्थापक आदेशों का उपयोग कर सकते हैं।</i>

  <b>🤖 <u>बॉट कमांड:</u></b>
  <b>/sudolist -</b> सभी sudo उपयोगकर्ताओं को सूचीबद्ध करें
  <b>/addsudo [उपयोगकर्ता] -</b> एक उपयोगकर्ता को sudo सूची में जोड़ें
  <b>/rmsudo [उपयोगकर्ता] -</b> किसी उपयोगकर्ता को sudo सूची से हटाएं

  <b>🌏 <u>वैश्विक प्रतिबंध समारोह:</u></b>
  <b>/gban [उपयोगकर्ता नाम या उपयोगकर्ता को उत्तर दें] -</b> किसी उपयोगकर्ता को बॉट द्वारा दी गई चैट से प्रतिबंधित करें और उसे अपने बॉट का उपयोग करने से रोकें
  <b>/ungban [उपयोगकर्ता नाम या उपयोगकर्ता को उत्तर] -</b> किसी उपयोगकर्ता को बॉट की gbanned सूची से हटाएं और उसे अपने बॉट का उपयोग करने की अनुमति दें
  <b>/gbannedusers -</b> Gbanned उपयोगकर्ताओं की सूची जांचें

  <b>⚠️ <u>ब्लैकलिस्ट चैट फ़ंक्शन:</u></b>
  <b>/blacklistchat [CHAT_ID] -</b> म्यूजिक बॉट का उपयोग करने से किसी भी चैट को ब्लैकलिस्ट करें
  <b>/व्हाइटलिस्टचैट [CHAT_ID] -</b> म्यूजिक बॉट का उपयोग करके किसी भी ब्लैकलिस्टेड चैट को व्हाइटलिस्ट करें
  <b>/ब्लैकलिस्टेडचैट -</b> सभी ब्लैकलिस्टेड चैट की जांच करें

  <b>🚫 <u>अवरुद्ध फ़ंक्शन:</u></b>
  <b>/ब्लॉक [उपयोगकर्ता नाम या उपयोगकर्ता को उत्तर] -</b> उपयोगकर्ता को बॉट कमांड का उपयोग करने से रोकता है
  <b>/अनब्लॉक करें [उपयोगकर्ता नाम या उपयोगकर्ता को उत्तर दें] -</b> किसी उपयोगकर्ता को बॉट की अवरुद्ध सूची से हटाएं।
  <b>/अवरुद्ध उपयोगकर्ता -</b> अवरुद्ध उपयोगकर्ता सूचियों की जाँच करें

  <b>🌐 <u>ब्रॉडकास्ट कमांड</u></b>
  <b>/प्रसारण [संदेश या संदेश का उत्तर] -</b> किसी भी संदेश को बॉट द्वारा प्रस्तुत चैट पर प्रसारित करें

  <u>प्रसारण के लिए विकल्प:</u>
  <b>-पिन -</b> इससे आपका संदेश पिन हो जाएगा
  <b>-पिनलाउड -</b> यह आपके संदेश को तेज़ अधिसूचना के साथ पिन कर देगा
  <b>-उपयोगकर्ता -</b> यह आपके संदेश को उन उपयोगकर्ताओं तक प्रसारित करेगा जिन्होंने आपका बॉट शुरू किया है
  <b>-सहायक -</b> यह आपके संदेश को आपके बॉट के सहायक खाते से प्रसारित करेगा
  <b>-नोबोट -</b> यह आपके बॉट को संदेश प्रसारित न करने के लिए बाध्य करेगा
  <b>उदाहरण:</b> <कोड>/प्रसारण -उपयोगकर्ता -सहायक -पिन हैलो परीक्षण</कोड>
  ──────────────────────────────

