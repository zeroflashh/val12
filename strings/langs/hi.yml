HELP_1: '<b><u>प्ले कमांड्स 🎵</u></b> <b>/play [नाम/लिंक] -</b> वॉयस चैट पर ऑडियो
  स्ट्रीम शुरू करें। <b>/vplay [नाम/लिंक] -</b> वॉयस चैट पर वीडियो स्ट्रीम शुरू करें।
  <b>/playforce -</b> फोर्स प्ले (मौजूदा बंद करके नया ट्रैक शुरू करें)। <b>/pause
  -</b> मौजूदा म्यूजिक स्ट्रीम को रोकें। <b>/resume -</b> रोका हुआ म्यूजिक फिर से
  चलाएं। <b>/skip -</b> अगले ट्रैक पर जाएं। <b>/stop or /end -</b> म्यूजिक बंद करें
  और पूरी कतार साफ़ करें। <b>/mute : </b> सभी के लिए स्ट्रीम म्यूट करें। <b>/unmute
  : </b> म्यूट स्ट्रीम अनम्यूट करें। <b>/queue -</b> म्यूजिक कतार में आने वाले ट्रैक
  दिखाएं। <b>/shuffle -</b> म्यूजिक कतार को रैंडमली शफ़ल करें। <b>/volume [1-200]
  : </b> बॉट का वॉल्यूम सेट करें। <b>/loop [enable/disable] -</b> मौजूदा ट्रैक पर
  लूप टॉगल करें। <b>/seek [सेकंड] -</b> स्ट्रीम को आगे/पीछे करें। <b>/seekback [सेकंड]
  -</b> स्ट्रीम को पीछे करें। <b>/speed -</b> प्लेबैक स्पीड बदलें (जैसे 0.5x, 1.0x,
  2.0x)। 💡  <b>चैनल प्ले:</b> चैनल प्ले के लिए <b>c</b> प्रीफिक्स यूज करें (जैसे /cplay)

  ───────────────────────────────────────────────'
HELP_2: '<b><u>एडमिन और ऑथराइज्ड यूजर कमांड्स 🛠️</u></b> <b>👤 <u>एडमिन कमांड्स</u></b>
  <b>/settings -</b> ग्रुप सेटिंग्स पैनल खोलें। <b>/language or /lang -</b> ग्रुप
  की भाषा बदलें। <b>/reload -</b> एडमिन लिस्ट और कैश रिफ्रेश करें। <b>/adminlist -</b>
  चैट की मौजूदा एडमिन लिस्ट देखें। <b>/ban_ghosts -</b> डिलीटेड एकाउंट्स को क्लीन
  करें।

  ───────────────────────────────────────────────

  <b>👤 <u>ऑथराइज्ड कमांड्स</u></b> <b>/auth [यूजर] -</b> ग्रुप की ऑथराइज्ड लिस्ट में
  यूजर जोड़ें। <b>/unauth [यूजर] -</b> ऑथराइज्ड लिस्ट से यूजर हटाएं। <b>/authusers
  -</b> ऑथराइज्ड यूजर्स की लिस्ट देखें।

  <i>-ऑथ यूजर एडमिन के बिना एडमिन कमांड्स यूज कर सकते हैं।</i>

  <b>🤖 <u>बॉट कमांड्स:</u></b> <b>/sudolist -</b> सभी सूडो यूजर्स की लिस्ट देखें।
  <b>/addsudo [यूजर] -</b> सूडो लिस्ट में यूजर जोड़ें। <b>/rmsudo [यूजर] -</b> सूडो
  लिस्ट से यूजर हटाएं।

  <b>👤 <u>GBAN फंक्शन:</u></b> <b>/gban [यूजरनेम या रिप्लाई] -</b> यूजर को बॉट की
  सर्व्ड चैट्स से बैन करें। <b>/ungban [यूजरनेम या रिप्लाई] -</b> GBan लिस्ट से हटाएं
  और यूजर को बॉट यूज करने दें। <b>/gbannedusers -</b> GBanned यूजर्स की लिस्ट देखें।

  <b>⚠️<u>ब्लैकलिस्ट चैट फंक्शन:</u></b> <b>/blacklistchat [CHAT_ID] -</b> किसी भी
  चैट को म्यूजिक बॉट से ब्लैकलिस्ट करें। <b>/whitelistchat [CHAT_ID] -</b> ब्लैकलिस्टेड
  चैट को व्हाइटलिस्ट करें। <b>/blacklistedchat -</b> सभी ब्लैकलिस्टेड चैट्स देखें।

  <b>👤 <u>ब्लॉक फंक्शन:</u></b> <b>/block [यूजरनेम या रिप्लाई] -</b> यूजर को बॉट कमांड्स
  यूज करने से रोकें। <b>/unblock [यूजरनेम या रिप्लाई] -</b> ब्लॉक लिस्ट से यूजर हटाएं।
  <b>/blockedusers -</b> ब्लॉक्ड यूजर्स की लिस्ट देखें।

  <b>🌐 <u>ब्रॉडकास्ट कमांड्स</u></b> <b>/broadcast [मैसेज या रिप्लाई] -</b> बॉट की
  सर्व्ड चैट्स में मैसेज भेजें।

  <u>ब्रॉडकास्ट ऑप्शन्स:</u> <b>-pin -</b> मैसेज पिन करें। <b>-pinloud -</b> लाउड
  नोटिफिकेशन के साथ पिन करें। <b>-user -</b> वो मैसेज यूजर्स को भेजें जिन्होंने बॉट
  को स्टार्ट किया है। <b>-assistant -</b> असिस्टेंट अकाउंट से मैसेज भेजें। <b>-nobot
  -</b> बॉट को मैसेज न भेजने के लिए मजबूर करें।

  <b>उदाहरण:</b> <code>/broadcast -user -assistant -pin हैलो टेस्टिंग</code>'
