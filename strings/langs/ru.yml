HELP_1: |-
  <b><u>КОМАНДЫ ВОСПРОИЗВЕДЕНИЯ МУЗЫКИ 🎵</u></b>
  ─────────────────────────────────

  <b>/play [Имя/Ссылка] –</b> Начать потоковую передачу звука в голосовом чате.
  <b>/vplay [Имя/Ссылка] –</b> Начать потоковую передачу видео в голосовом чате.
  <b>/playforce –</b> Принудительное воспроизведение (остановка текущего трека и начало нового трека)
  <b>/pause –</b> приостановить текущий музыкальный поток.
  <b>/resume –</b> возобновить приостановленный музыкальный поток.
  <b>/skip –</b> Переход от текущего трека к следующему в очереди.
  <b>/stop или /end –</b> остановить музыку и очистить всю очередь.
  <b>/queue –</b> Показать предстоящие треки в очереди музыки.
  <b>/shuffle –</b> Случайно перемешать музыкальную очередь.
  <b>/volume [1-200] –</b> регулировка уровня громкости ботов.
  <b>/loop [включить/отключить] –</b> переключить цикл для текущего трека.
  <b>/stream [ссылка] –</b> потоковое аудио/видео по прямой ссылке.
  <i>- поддерживаемые форматы потоковой передачи: m3u8 и индексные ссылки.</i>
  <b>/seek [секунды] –</b> переместить поток вперед или назад.
  <b>/seekback [Секунды] –</b> Ищет поток назад.
  <b>/speed –</b> изменить скорость воспроизведения (например, 0,5x, 1,0x, 2,0x).

  <b>💡Воспроизведение канала:</b> используйте префикс c (например, /cplay).
  ─────────────────────────────────

HELP_2: |-
  <b><u>КОМАНДЫ АДМИНИСТРА И АВТОРИЗОВАННЫХ ПОЛЬЗОВАТЕЛЕЙ 🛠️</u></b>
  ─────────────────────────────────

  <b>👤 <u>Команды администратора</u></b>
  <b>/settings –</b> Открывает панель настроек группы.
  <b>/lang –</b> Изменить язык бота для вашей группы.
  <b>/reload –</b> обновляет список администраторов и кеш.
  <b>/adminlist –</b> Получить текущий список администраторов чата.
  <b>/ban_ghosts -</b> Очистка удаленных учетных записей.

  <b>👤 <u>Авторизованные команды</u></b>
  <b>/auth [Пользователь] –</b> Добавляет пользователя в авторизованный список группы.
  <b>/unauth [Пользователь] –</b> Удаляет пользователя из списка авторизованных пользователей.
  <b>/authusers –</b> показывает список авторизованных пользователей.
  <i>-Пользователи, прошедшие аутентификацию, могут использовать команды администратора, не будучи администратором.</i>

  <b>🤖 <u>Команды бота:</u></b>
  <b>/sudolist –</b> Список всех пользователей sudo.
  <b>/addsudo [Пользователь] –</b> Добавить пользователя в список sudo.
  <b>/rmsudo [Пользователь] –</b> удалить пользователя из списка sudo.

  <b>🌏 <u>Функция глобального запрета:</u></b>
  <b>/gban [Имя пользователя или ответ пользователю] –</b> запретить пользователю доступ к чату, обслуживаемому ботом, и запретить ему использовать вашего бота.
  <b>/ungban [Имя пользователя или ответ пользователю] –</b> Удалить пользователя из списка запрещенных ботов и разрешить ему использовать вашего бота.
  <b>/gbannedusers –</b> Проверка списков пользователей, забаненных G

  <b>⚠️ <u>Функция чата в черном списке:</u></b>
  <b>/blacklistchat [CHAT_ID] –</b> занести в черный список любой чат, запрещенный с помощью Music Bot.
  <b>/whitelistchat [CHAT_ID] –</b> внести в белый список любой чат, занесенный в черный список, с помощью Music Bot.
  <b>/blacklistedchats –</b> проверить все чаты в черном списке.

  <b>🚫 <u>Заблокированная функция:</u></b>
  <b>/block [Имя пользователя или ответ пользователю] –</b> запрещает пользователю использовать команды бота.
  <b>/разблокировать [имя пользователя или ответ пользователю] –</b> удалить пользователя из черного списка бота.
  <b>/blockedusers –</b> Проверка списков заблокированных пользователей.

  <b>🌐 <u>Команды трансляции</u></b>
  <b>/broadcast [Сообщение или ответ на сообщение] –</b> транслировать любое сообщение в чаты, обслуживаемые ботом.

  <u>Параметры трансляции:</u>
  <b>-pin -</b> Это закрепит ваше сообщение.
  <b>-pinloud –</b> ваше сообщение будет закреплено громким уведомлением.
  <b>-user –</b> ваше сообщение будет передано пользователям, запустившим вашего бота.
  <b>-assistant –</b> ваше сообщение будет транслироваться из учетной записи помощника вашего бота.
  <b>-nobot -</b> Это заставит вашего бота не транслировать сообщения.
  <b>Пример:</b> <code>/broadcast -user -assistant -pin Hello Testing</code>
  ─────────────────────────────────

HELP_3: |-
  <b><u>КОМАНДЫ БОТА 🤖</u></b>
  ─────────────────────────────────

  <b>🤖 <u>Команды бота</u></b>
  <b>/karma -</b> Статистика кармы
  <b>/lyrics [Название песни] –</b> Получить текст песни
  <b>/ping –</b> Проверка задержки и статистики бота.
  <b>/search [Запрос] –</b> Поиск на YouTube
  <b>/song или /ytdl [Имя/Ссылка] –</b> Загрузить аудио/видео с YouTube

  <b>🕹️ <u>Игровые команды</u></b>
  <b>/dice –</b> бросить случайный кубик.
  <b>/dart –</b> бросить дротик
  <b>/basketball –</b> Забить несколько мячей в корзину
  <b>/bowling –</b> Игра в боулинг
  <b>/футбол –</b> Играть в футбол
  <b>/slots –</b> Испытайте удачу в игровых автоматах
  <b>/ship или /couple –</b> выберите пару дня в своей группе.

  <b>✨ <u>Дополнительные команды</u></b>
  <b>/commit –</b> Создание забавных сообщений о фиксации
  <b>/carbon [text] –</b> Создать изображение углерода
  <b>/q или /quotly –</b> Создать наклейку с цитатой
  <b>/random [длина] –</b> Генерировать случайные сложные пароли
  <b>/runs -</b> не знаю, проверь себя
  <b>/tr [язык] [Текст] –</b> Перевести текст
  <b>/id –</b> Получите идентификатор пользователя или идентификатор группы.
  <b>/info [пользователь] –</b> Получить подробную информацию о пользователе.
  <b>/invite –</b> Получить ссылку для приглашения в группу.
  <b>/sticker_id –</b> Получить идентификатор файла стикера.
  <b>/tts [текст] –</b> Преобразование текста в речь
  <b>/genstr -</b> Создать строковый сеанс (Pyrogram/Telethon)
  <b>/reload –</b> обновить список администраторов и кеш.

  <i>список будет расширяться со временем...</i>
  ─────────────────────────────────

HELP_4: |-
  <b><u>КОМАНДЫ SUDO 👮</u></b>
  ─────────────────────────────────

  <b>/activevc –</b> Список активных голосовых и видеочатов.
  <b>/speedtest –</b> Проверить скорость сервера.
  <b>/stats –</b> Проверить статистику использования бота.
  <b>/logs –</b> получение журналов бота для отладки.
  <b>/autoend [enable|disable] –</b> Включить автоматическое завершение трансляции через 3 минуты, если никто не слушает.
  <b>/logger [включить/выключить] -</b> Бот регистрирует искомые запросы в группе логгеров.
  <b>/maintenance [включить/отключить] –</b> переключить режим обслуживания
  ─────────────────────────────────
