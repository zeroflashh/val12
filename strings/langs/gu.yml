HELP_1: |-
  <b><u>મ્યુઝિક પ્લે કમાન્ડ્સ 🎵</u></b>
  ──────────────────────────────────

  <b>/પ્લે [નામ/લિંક] -</b> વૉઇસ ચેટ પર ઑડિયો સ્ટ્રીમ કરવાનું શરૂ કરો.
  <b>/vplay [નામ/લિંક] -</b> વૉઇસ ચેટ પર વિડિઓ સ્ટ્રીમ કરવાનું પ્રારંભ કરો
  <b>/playforce -</b> ફોર્સ પ્લે (વર્તમાન બંધ કરે છે અને નવો ટ્રેક શરૂ કરે છે)
  <b>/થોભો -</b> વર્તમાન સંગીત પ્રવાહને થોભાવો
  <b>/ફરીથી શરૂ કરો -</b> થોભાવેલ સંગીત સ્ટ્રીમ ફરી શરૂ કરો
  <b>/છોડી દો -</b> વર્તમાન ટ્રૅકને કતારમાંના આગલા ટ્રૅકને અવગણો
  <b>/stop અથવા /end -</b> સંગીત બંધ કરો અને સમગ્ર કતાર સાફ કરો
  <b>/કતાર -</b> સંગીત કતારમાં આગામી ટ્રેક બતાવો
  <b>/શફલ -</b> સંગીત કતારને રેન્ડમલી શફલ કરો
  <b>/વોલ્યુમ [1-200] -</b> બોટ્સ વોલ્યુમ સ્તરને સમાયોજિત કરો
  <b>/લૂપ [સક્ષમ/અક્ષમ કરો] -</b> વર્તમાન ટ્રૅક માટે લૂપ ટૉગલ કરો
  <b>/સ્ટ્રીમ [લિંક] -</b> સીધી લિંકથી ઑડિયો/વિડિયો સ્ટ્રીમ કરો
  <i>- સ્ટ્રીમિંગ માટે સપોર્ટેડ ફોર્મેટ્સ : m3u8 અને ઇન્ડેક્સ લિંક્સ.</i>
  <b>/શોધી [સેકન્ડ] -</b> સ્ટ્રીમને આગળ અથવા પાછળ ખસેડો
  <b>/સીકબેક [સેકન્ડ્સ] -</b> સ્ટ્રીમને પાછળની તરફ શોધે છે
  <b>/સ્પીડ -</b> પ્લેબેક સ્પીડ બદલો (દા.ત., 0.5x, 1.0x, 2.0x)

  <b>💡ચેનલ ચલાવો:</b> ઉપસર્ગ તરીકે c નો ઉપયોગ કરો (દા.ત. /cplay)
  ──────────────────────────────────

HELP_2: |-
  <b><u>એડમિન અને અધિકૃત વપરાશકર્તા આદેશો 🛠️</u></b>
  ──────────────────────────────────

  <b>👤 <u>એડમિન આદેશો</u></b>
  <b>/સેટિંગ્સ -</b> જૂથ સેટિંગ્સ પેનલ ખોલે છે
  <b>/lang -</b> તમારા જૂથ માટે બોટની ભાષા બદલો
  <b>/રીલોડ કરો -</b> એડમિનલિસ્ટ અને કેશને તાજું કરે છે
  <b>/એડમિનલિસ્ટ -</b> ચેટની વર્તમાન એડમિન સૂચિ મેળવો
  <b>/ban_ghosts -</b> કાઢી નાખેલ એકાઉન્ટ્સ સાફ કરો

  <b>👤 <u>અધિકૃત આદેશો</u></b>
  <b>/auth [વપરાશકર્તા] -</b> જૂથની અધિકૃત સૂચિમાં વપરાશકર્તાને ઉમેરે છે
  <b>/unauth [વપરાશકર્તા] -</b> અધિકૃત સૂચિમાંથી વપરાશકર્તાને દૂર કરે છે.
  <b>/authusers -</b> અધિકૃત વપરાશકર્તાઓની સૂચિ બતાવે છે
  <i>-Auth વપરાશકર્તાઓ એડમિન બન્યા વિના એડમિન આદેશોનો ઉપયોગ કરી શકે છે.</i>

  <b>🤖 <u>બોટ આદેશો:</u></b>
  <b>/સુડોલિસ્ટ -</b> બધા સુડો વપરાશકર્તાઓની સૂચિ બનાવો
  <b>/addsudo [User] -</b> sudo સૂચિમાં વપરાશકર્તા ઉમેરો
  <b>/rmsudo [User] -</b> sudo સૂચિમાંથી વપરાશકર્તાને દૂર કરો

  <b>🌏 <u>વૈશ્વિક પ્રતિબંધ કાર્ય:</u></b>
  <b>/gban [વપરાશકર્તાનું નામ અથવા વપરાશકર્તાને જવાબ આપો] -</b> બોટની સર્વ કરેલ ચેટમાંથી વપરાશકર્તાને Gban કરો અને તેને તમારા બોટનો ઉપયોગ કરતા અટકાવો
  <b>/ungban [વપરાશકર્તાનું નામ અથવા વપરાશકર્તાને જવાબ આપો] -</b> બોટની gbanned સૂચિમાંથી વપરાશકર્તાને દૂર કરો અને તેને તમારા બૉટનો ઉપયોગ કરવાની મંજૂરી આપો
  <b>/gbannedusers -</b> Gbanned વપરાશકર્તાઓની સૂચિ તપાસો

  <b>⚠️ <u>બ્લેકલિસ્ટ ચેટ ફંક્શન:</u></b>
  <b>/blacklistchat [CHAT_ID] -</b> સંગીત બૉટનો ઉપયોગ કરીને કોઈપણ ચેટને બ્લેકલિસ્ટ કરો
  <b>/વ્હાઇટલિસ્ટ ચેટ [CHAT_ID] -</b> સંગીત બૉટનો ઉપયોગ કરીને કોઈપણ બ્લેકલિસ્ટેડ ચેટને વ્હાઇટલિસ્ટ
  <b>/blacklistedchats -</b> બધી બ્લેકલિસ્ટેડ ચેટ્સ તપાસો

  <b>🚫 <u>અવરોધિત કાર્ય:</u></b>
  <b>/અવરોધિત કરો [વપરાશકર્તાનામ અથવા વપરાશકર્તાને જવાબ આપો] -</b> વપરાશકર્તાને બોટ આદેશોનો ઉપયોગ કરતા અટકાવે છે
  <b>/અનબ્લોક કરો [વપરાશકર્તાનું નામ અથવા વપરાશકર્તાને જવાબ આપો] -</b> બોટની અવરોધિત સૂચિમાંથી વપરાશકર્તાને દૂર કરો.
  <b>/blockedusers -</b> અવરોધિત વપરાશકર્તાઓની સૂચિ તપાસો

  <b>🌐 <u>પ્રસારણ આદેશો</u></b>
  <b>/પ્રસારણ [સંદેશ અથવા સંદેશનો જવાબ] -</b> બોટની સર્વ કરેલી ચેટ્સ પર કોઈપણ સંદેશનું પ્રસારણ કરો

  <u>પ્રસારણ માટેના વિકલ્પો:</u>
  <b>-પિન -</b> આ તમારા સંદેશને પિન કરશે
  <b>-pinloud -</b> આ તમારા સંદેશને મોટેથી સૂચના સાથે પિન કરશે
  <b>-વપરાશકર્તા -</b> આ તમારા સંદેશને તે વપરાશકર્તાઓને બ્રોડકાસ્ટ કરશે જેમણે તમારો બોટ શરૂ કર્યો છે
  <b>-સહાયક -</b> આ તમારા બોટના સહાયક ખાતામાંથી તમારા સંદેશને બ્રોડકાસ્ટ કરશે
  <b>-nobot -</b> આ તમારા બોટને સંદેશ પ્રસારિત ન કરવા દબાણ કરશે
  <b>ઉદાહરણ:</b> <code>/broadcast -user -assistant -pin Hello Testing</code>
  ──────────────────────────────────

HELP_3: |-
  <b><u>BOT આદેશો 🤖</u></b>
  ──────────────────────────────────

  <b>🤖 <u>બોટ આદેશો</u></b>
  <b>/કર્મ -</b> કર્મના આંકડા
  <b>/ગીત [ગીતનું નામ] -</b> ગીતના ગીતો મેળવો
  <b>/પિંગ -</b> બોટ લેટન્સી અને આંકડા તપાસો
  <b>/શોધ [ક્વેરી] -</b> YouTube પર શોધો
  <b>/ગીત અથવા /ytdl [નામ/લિંક] -</b> YouTube ઑડિઓ/વિડિયો ડાઉનલોડ કરો

  <b>🕹️ <u>ગેમિંગ કમાન્ડ</u></b>
  <b>/ડાઇસ -</b> રેન્ડમ ડાઇસ રોલ કરો
  <b>/ડાર્ટ -</b> ડાર્ટ ફેંકો
  <b>/બાસ્કેટબોલ -</b> કેટલાક હૂપ્સ શૂટ કરો
  <b>/બોલિંગ -</b> બોલિંગ રમો
  <b>/ફૂટબોલ -</b> ફૂટબોલ રમો
  <b>/સ્લોટ્સ -</b> સ્લોટ્સ પર તમારું નસીબ અજમાવો
  <b>/જહાજ અથવા /દંપતી -</b> તમારા જૂથમાં દિવસનો બે દિવસ પસંદ કરો

  <b>✨ <u>અતિરિક્ત આદેશો</u></b>
  <b>/કમિટ -</b> ફની કમિટ મેસેજીસ જનરેટ કરો
  <b>/કાર્બન [ટેક્સ્ટ] -</b> કાર્બન ઇમેજ બનાવો
  <b>/q અથવા /quotly -</b> એક સ્ટીકર ક્વોટ બનાવો
  <b>/રેન્ડમ [લંબાઈ] -</b> રેન્ડમ જટિલ પાસવર્ડ્સ બનાવો
  <b>/રન -</b> idk જાતે પરીક્ષણ કરો
  <b>/tr [lang] [ટેક્સ્ટ] -</b> ટેક્સ્ટનો અનુવાદ કરો
  <b>/id -</b> તમારું યુઝર આઈડી અથવા ગ્રુપ આઈડી મેળવો
  <b>/info [user] -</b> વિગતવાર વપરાશકર્તા માહિતી મેળવો
  <b>/આમંત્રિત કરો -</b> જૂથ આમંત્રણ લિંક મેળવો.
  <b>/sticker_id -</b> સ્ટિકર ફાઇલ ID મેળવો
  <b>/tts [ટેક્સ્ટ] -</b> ટેક્સ્ટને સ્પીચમાં કન્વર્ટ કરો
  <b>/genstr -</b> સ્ટ્રિંગ સત્ર જનરેટ કરો (પાયરોગ્રામ/ટેલિથોન)
  <b>/રીલોડ કરો -</b> એડમિન સૂચિ અને કેશ તાજું કરો

  <i>સૂચિ સમય પ્રમાણે વધશે...</i>
  ──────────────────────────────────

HELP_4: |-
  <b><u>સુડો આદેશો 👮</u></b>
  ──────────────────────────────────

  <b>/activevc -</b> સક્રિય વૉઇસ અને વીડિયોચેટ્સની સૂચિ બનાવો
  <b>/speedtest -</b> સર્વરની ઝડપનું પરીક્ષણ કરો
  <b>/આંકડા -</b> બોટ વપરાશના આંકડા તપાસો
  <b>/લોગ્સ -</b> ડીબગીંગ માટે બોટ લોગ મેળવો
  <b>/ઓટોએન્ડ [સક્ષમ|અક્ષમ કરો] -</b> જો કોઈ સાંભળતું ન હોય તો 3 મિનિટ પછી ઑટો સ્ટ્રીમ એન્ડને સક્ષમ કરો
  <b>/લોગર [સક્ષમ / અક્ષમ] -</b> બોટ લોગર જૂથમાં શોધેલી ક્વેરીઝને લૉગ કરે છે
  <b>/જાળવણી [સક્ષમ/અક્ષમ કરો] -</b> જાળવણી મોડને ટૉગલ કરો
  ──────────────────────────────────
