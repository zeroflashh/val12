HELP_1: "<b><u>PLAY COMMANDS \U0001F3B5</u></b>\n───────────────────────────────────────────────\n\
  - - - - - - - - - - - - - - - - - - - - - - - - - - -\n<b>/play [Name/Link] -</b>\
  \ Start streaming audio on voice chat.\n<b>/vplay [Name/Link] -</b> Start streaming\
  \ video on voice chat.\n<b>/playforce -</b> Force play (stops current and starts\
  \ new track).\n<b>/pause -</b> Pause the current music stream.\n<b>/resume -</b>\
  \ Resume the paused music stream.\n<b>/skip -</b> Skip current track to the next\
  \ in queue.\n<b>/stop or /end -</b> Stop music and clear the entire queue.\n<b>/mute\
  \ : </b> Mute the ongoing stream for all.\n<b>/unmute : </b> Unmute the muted stream.\n\
  <b>/queue -</b> Show upcoming tracks in the music queue.\n<b>/shuffle -</b> Randomly\
  \ shuffle the music queue.\n<b>/volume [1-200] : </b> Adjust the bot's volume level.\n\
  <b>/loop [enable/disable] -</b> Toggle loop for current track.\n<b>/seek [seconds]\
  \ -</b> Move the stream forward or backward.\n<b>/seekback [Seconds] -</b> Seeks\
  \ the stream backward.\n<b>/speed -</b> Change playback speed (e.g., 0.5x, 1.0x,\
  \ 2.0x).\n\n\U0001F4A1  <b>Channel Play:</b> Use <b>c</b> as prefix for channel\
  \ play (e.g. /cplay)\n ───────────────────────────────\n"
HELP_2: "<b><u>ADMIN & AUTHORISED USER COMMANDS \U0001F6E0️</u></b>\n───────────────────────────────────────────────\n\
  ───────────────────────────────\n\n  <b>\U0001F464 <u>Admin Commands</u></b>\n \
  \ <b>/settings -</b> Opens the group settings panel.\n  <b>/language or /lang -</b>\
  \ Change the bot's language for your group.\n  <b>/refresh -</b> Refreshes the admin\
  \ list and cache.\n  <b>/adminlist -</b> Get the current admin list of the chat.\n\
  \  <b>/ban_ghosts -</b> Cleanup deleted accounts.\n\n  <b>\U0001F464 <u>AUTHORISED\
  \ COMMANDS</u></b>\n  <b>/auth [User] -</b> Adds a user to authorized list of the\
  \ group.\n  <b>/unauth [User] -</b> Removes a user from authorized list.\n  <b>/authusers\
  \ -</b> Shows the list of authorized users.\n\n  <i>-Auth users can use admin commands\
  \ without being an admin.</i>\n\n  <b>\U0001F916 <u>BOT COMMANDS:</u></b>\n  <b>/sudolist\
  \ -</b> List all sudo users.\n  <b>/addsudo [User] -</b> Add a user to sudo list.\n\
  \  <b>/rmsudo [User] -</b> Remove a user from sudo list.\n\n  <b>\U0001F464 <u>GBAN\
  \ FUNCTION:</u></b>\n  <b>/gban [Username or Reply to a user] -</b> Gban a user\
  \ from bot's served chat and stop him from using your bot.\n  <b>/ungban [Username\
  \ or Reply to a user] -</b> Remove a user from Bot's gbanned List and allow him\
  \ for using your bot\n  <b>/gbannedusers -</b> Check Gbanned Users Lists\n\n  <b>⚠️<u>BLACKLIST\
  \ CHAT FUNCTION:</u></b>\n  <b>/blacklistchat [CHAT_ID] -</b> Blacklist any chat\
  \ from using Music Bot\n  <b>/whitelistchat [CHAT_ID] -</b> Whitelist any blacklisted\
  \ chat from using Music Bot\n  <b>/blacklistedchat -</b> Check all blacklisted chats.\n\
  \n  <b>\U0001F464 <u>BLOCKED FUNCTION:</u></b>\n  <b>/block [Username or Reply to\
  \ a user] -</b> Prevents a user from using bot commands.\n  <b>/unblock [Username\
  \ or Reply to a user] -</b> Remove a user from Bot's Blocked List.\n  <b>/blockedusers\
  \ -</b> Check blocked Users Lists\n\n\n  <b>\U0001F310 <u>BROADCAST COMMANDS</u></b>\n\
  \  <b>/broadcast [Message or Reply to a Message] -</b> Broadcast any message to\
  \ Bot's Served Chats.\n\n  <u>options for broadcast:</u>\n  <b>-pin -</b> This will\
  \ pin your message \n  <b>-pinloud -</b> This will pin your message with loud notification\n\
  \  <b>-user -</b> This will broadcast your message to the users who have started\
  \ your bot.\n  <b>-assistant -</b> This will broadcast your message from assistant\
  \ account of your bot.\n  <b>-nobot -</b> This will force your bot to not broadcast\
  \ message\n\n  <b>Example:</b> <code>/broadcast -user -assistant -pin Hello Testing</code>\n\
  \  ───────────────────────────────\n"
HELP_3: '<b><u>BOT COMMANDS 🤖</u></b>

  ───────────────────────────────────────────────


  <b>/carbon [Text] -</b> Create a carbon image.

  <b>/karma -</b> Karma stats.

  <b>/kang -</b> Add sticker to your pack.

  <b>/tr [Lang] [Text] -</b> Translate text.

  <b>/q or /quotly -</b> Create a sticker quote.

  <b>/sticker_id -</b> Get sticker file ID.

  <b>/invite -</b> Get group invite link.


  <b>/lyrics [Song Name] -</b> Get song lyrics.

  <b>/search [Query] -</b> Search on YouTube.

  <b>/ytdl or /song [Name/Link] -</b> Download YouTube audio/video.


  <b>/id -</b> Get your user id or group id.

  <b>/info [User] -</b> Get detailed user information.

  <b>/ping -</b> Check bot latency and stats.

  <b>/eval [Code] -</b> Evaluate Python code (Owner Only).


  <b>/genstr -</b> Generate String Session (Pyrogram/Telethon).


  '
HELP_4: '<b><u>GAMING COMMANDS 🕹️</u></b>

  ───────────────────────────────────────────────


  <b>/dice -</b> Roll a random dice.

  <b>/dart -</b> Throw a dart.

  <b>/basketball -</b> Shoot some hoops.

  <b>/bowling -</b> Play bowling.

  <b>/football -</b> Play football.

  <b>/slot -</b> Try your luck at slots.

  <b>/ship or /couple -</b> Pick the couple of the day in your group.


  <i>list will grow as per demand...</i>


  '
HELP_5: '<b><u>SUDO COMMANDS 👮</u></b>


  <b>/activevc -</b> List active voice and videochats with counts.

  <b>/speedtest -</b> Test server speed.

  <b>/stats or /gstats -</b> Check bot usage statistics.

  <b>/logs -</b> Get bot logs for debugging.

  <b>/autoend [enable|disable] -</b> Enable Auto stream end after 3 mins if no one
  is listening.

  <b>/logger [enable / disable] -</b> Bot logs the searched queries in logger group.

  <b>/maintenance [enable/disable] -</b> Toggle maintenance mode.

  <b>/update -</b> Pull latest updates from Git.

  <b>/vars -</b> List all config variables.

  <b>/reboot or /restart -</b> Restart the bot.


  '

