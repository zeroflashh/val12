HELP_1: |
  <b><u>音乐播放命令 🎵</u></b>
  ───────────────────────────────

  <b>/play [名称/链接] -</b> 在语音聊天中开始播放音频。
  <b>/vplay [名称/链接] -</b> 在语音聊天中开始播放视频
  <b>/playforce -</b> 强制播放（停止当前并开始新曲目）
  <b>/pause -</b> 暂停当前音乐流
  <b>/resume -</b> 恢复暂停的音乐流
  <b>/skip -</b> 跳过当前曲目到队列中的下一首
  <b>/stop 或 /end -</b> 停止音乐并清空整个队列
  <b>/queue -</b> 显示音乐队列中的待播曲目
  <b>/shuffle -</b> 随机打乱音乐队列
  <b>/volume [1-200] -</b> 调整机器人的音量级别
  <b>/loop [enable/disable] -</b> 切换当前曲目的循环
  <b>/stream [链接] -</b> 从直链播放音频/视频
  <i>- 支持的流格式：m3u8 和索引链接。</i>
  <b>/seek [秒数] -</b> 将流向前或向后移动
  <b>/seekback [秒数] -</b> 将流向后跳转
  <b>/speed -</b> 更改播放速度（例如 0.5x、1.0x、2.0x）

  <b>💡频道播放：</b> 使用 c 作为前缀（例如 /cplay）
  ───────────────────────────────

HELP_2: |
  <b><u>管理员和授权用户命令 🛠️</u></b>
  ───────────────────────────────

  <b>👤 <u>管理员命令</u></b>
  <b>/settings -</b> 打开群组设置面板
  <b>/lang -</b> 更改机器人在您群组中的语言
  <b>/reload -</b> 刷新管理员列表和缓存
  <b>/adminlist -</b> 获取当前聊天的管理员列表
  <b>/ban_ghosts -</b> 清理已删除的账户

  <b>👤 <u>授权命令</u></b>
  <b>/auth [用户] -</b> 将用户添加到群组的授权列表
  <b>/unauth [用户] -</b> 从授权列表中移除用户
  <b>/authusers -</b> 显示授权用户列表
  <i>-授权用户可以在不是管理员的情况下使用管理员命令。</i>

  <b>🤖 <u>机器人命令：</u></b>
  <b>/sudolist -</b> 列出所有sudo用户
  <b>/addsudo [用户] -</b> 将用户添加到sudo列表
  <b>/rmsudo [用户] -</b> 从sudo列表中移除用户

  <b>🌏 <u>全局封禁功能：</u></b>
  <b>/gban [用户名或回复用户] -</b> 从机器人的服务聊天中全局封禁用户并阻止其使用您的机器人
  <b>/ungban [用户名或回复用户] -</b> 从机器人的全局封禁列表中移除用户并允许其使用您的机器人
  <b>/gbannedusers -</b> 查看被全局封禁的用户列表

  <b>⚠️ <u>黑名单聊天功能：</u></b>
  <b>/blacklistchat [聊天ID] -</b> 将任何聊天列入音乐机器人的黑名单
  <b>/whitelistchat [聊天ID] -</b> 将任何已列入黑名单的聊天列入白名单
  <b>/blacklistedchats -</b> 查看所有被列入黑名单的聊天

  <b>🚫 <u>封禁功能：</u></b>
  <b>/block [用户名或回复用户] -</b> 阻止用户使用机器人命令
  <b>/unblock [用户名或回复用户] -</b> 从机器人的封禁列表中移除用户
  <b>/blockedusers -</b> 查看被封禁的用户列表

  <b>🌐 <u>广播命令</u></b>
  <b>/broadcast [消息或回复消息] -</b> 向机器人的服务聊天广播任何消息

  <u>广播选项：</u>
  <b>-pin -</b> 这将固定您的消息
  <b>-pinloud -</b> 这将带有响铃通知固定您的消息
  <b>-user -</b> 这将向已启动您机器人的用户广播消息
  <b>-assistant -</b> 这将从您机器人的助手账户广播消息
  <b>-nobot -</b> 这将强制您的机器人不广播消息
  <b>示例：</b> <code>/broadcast -user -assistant -pin Hello Testing</code>
  ───────────────────────────────

HELP_3: |
  <b><u>机器人命令 🤖</u></b>
  ───────────────────────────────

  <b>🤖 <u>机器人命令</u></b>
  <b>/karma -</b> 积分统计
  <b>/lyrics [歌曲名称] -</b> 获取歌曲歌词
  <b>/ping -</b> 检查机器人延迟和状态
  <b>/search [查询] -</b> 在油管上搜索
  <b>/song 或 /ytdl [名称/链接] -</b> 下载油管音频/视频

  <b>🕹️ <u>游戏命令</u></b>
  <b>/dice -</b> 掷骰子
  <b>/dart -</b> 投飞镖
  <b>/basketball -</b> 投篮
  <b>/bowling -</b> 打保龄球
  <b>/football -</b> 踢足球
  <b>/slots -</b> 试试运气
  <b>/ship 或 /couple -</b> 选出您群组中今天的组合

  <b>✨ <u>额外命令</u></b>
  <b>/commit -</b> 生成有趣的提交消息
  <b>/carbon [文本] -</b> 创建碳图片
  <b>/q 或 /quotly -</b> 创建贴纸引用
  <b>/random [长度] -</b> 生成随机复杂密码
  <b>/runs -</b> 我不知道，自己测试吧
  <b>/tr [语言] [文本] -</b> 翻译文本
  <b>/id -</b> 获取您的用户ID或群组ID
  <b>/info [用户] -</b> 获取详细用户信息
  <b>/invite -</b> 获取群组邀请链接
  <b>/sticker_id -</b> 获取贴纸文件ID
  <b>/tts [文本] -</b> 将文本转换为语音
  <b>/genstr -</b> 生成字符串会话（Pyrogram/Telethon）
  <b>/reload -</b> 刷新管理员列表和缓存

  <i>列表会随时间增长...</i>
  ───────────────────────────────

HELP_4: |
  <b><u>SUDO命令 👮</u></b>
  ───────────────────────────────

  <b>/activevc -</b> 列出活动的语音和视频聊天
  <b>/speedtest -</b> 测试服务器速度
  <b>/stats -</b> 检查机器人使用统计
  <b>/logs -</b> 获取机器人日志以进行调试
  <b>/autoend [enable|disable] -</b> 如果没有人收听，则在3分钟后启用自动结束播放
  <b>/logger [enable / disable] -</b> 机器人在日志群中记录搜索查询
  <b>/maintenance [enable/disable] -</b> 切换维护模式
  ───────────────────────────────