HELP_1: |
  <b><u>Music PLAY COMMANDS 🎵</u></b>
  ───────────────────────────────

  <b>/play [Name/Link] -</b> Start streaming audio on voice chat.
  <b>/vplay [Name/Link] -</b> Start streaming video on voice chat
  <b>/playforce -</b> Force play (stops current and starts new track)
  <b>/pause -</b> Pause the current music stream
  <b>/resume -</b> Resume the paused music stream
  <b>/skip -</b> Skip current track to the next in queue
  <b>/stop or /end -</b> Stop music and clear the entire queue
  <b>/queue -</b> Show upcoming tracks in the music queue
  <b>/shuffle -</b> Randomly shuffle the music queue
  <b>/volume [1-200] -</b> Adjust the bots volume level
  <b>/loop [enable/disable] -</b> Toggle loop for current track
  <b>/stream [link] -</b> Stream audio/video from a direct link
  <i>- supported formats for streaming : m3u8 and index links.</i>
  <b>/seek [seconds] -</b> Move the stream forward or backward
  <b>/seekback [Seconds] -</b> Seeks the stream backward
  <b>/speed -</b> Change playback speed (e.g., 0.5x, 1.0x, 2.0x)

  <b>💡Channel Play:</b> Use c as prefix (e.g. /cplay)
  ───────────────────────────────

HELP_2: |
  <b><u>ADMIN AND AUTHORISED USER COMMANDS 🛠️</u></b>
  ───────────────────────────────

  <b>👤 <u>Admin Commands</u></b>
  <b>/settings -</b> Opens the group settings panel
  <b>/lang -</b> Change the bot's language for your group
  <b>/reload -</b> Refreshes the adminlist and cache
  <b>/adminlist -</b> Get the current admin list of the chat
  <b>/ban_ghosts -</b> Cleanup deleted accounts

  <b>👤 <u>Authorised Commands</u></b>
  <b>/auth [User] -</b> Adds a user to authorized list of the group
  <b>/unauth [User] -</b> Removes a user from authorized list.
  <b>/authusers -</b> Shows the list of authorized users
  <i>-Auth users can use admin commands without being an admin.</i>

  <b>🤖 <u>Bot Commands:</u></b>
  <b>/sudolist -</b> List all sudo users
  <b>/addsudo [User] -</b> Add a user to sudo list
  <b>/rmsudo [User] -</b> Remove a user from sudo list

  <b>🌏 <u>Global Ban Function:</u></b>
  <b>/gban [Username or Reply to a user] -</b> Gban a user from bot's served chat and stop him from using your bot
  <b>/ungban [Username or Reply to a user] -</b> Remove a user from Bot's gbanned List and allow him for using your bot
  <b>/gbannedusers -</b> Check Gbanned Users Lists

  <b>⚠️ <u>Blacklist Chat Function:</u></b>
  <b>/blacklistchat [CHAT_ID] -</b> Blacklist any chat from using Music Bot
  <b>/whitelistchat [CHAT_ID] -</b> Whitelist any blacklistedchat from using Music Bot
  <b>/blacklistedchats -</b> Check all blacklisted chats

  <b>🚫 <u>Blocked Function:</u></b>
  <b>/block [Username or Reply to a user] -</b> Prevents a user from using bot commands
  <b>/unblock [Username or Reply to a user] -</b> Remove a user from Bot's Blocked List.
  <b>/blockedusers -</b> Check blocked Users Lists

  <b>🌐 <u>Broadcast Commands</u></b>
  <b>/broadcast [Message or Reply to a Message] -</b> Broadcast any message to Bot's Served Chats

  <u>Options for broadcast:</u>
  <b>-pin -</b> This will pin your message
  <b>-pinloud -</b> This will pin your message with loud notification
  <b>-user -</b> This will broadcast your message to the users who have started your bot
  <b>-assistant -</b> This will broadcast your message from assistant account of your bot
  <b>-nobot -</b> This will force your bot to not broadcast message
  <b>Example:</b> <code>/broadcast -user -assistant -pin Hello Testing</code>
  ───────────────────────────────

